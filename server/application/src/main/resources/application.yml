spring:
  application:
    name: hiltech-server
  datasource:
    url: ${HILTECH_DB_URL:jdbc:postgresql://localhost:5432/hiltech}
    username: ${HILTECH_DB_USER:hiltech}
    password: ${HILTECH_DB_PASSWORD:hiltech}
  flyway:
    enabled: true
    locations: filesystem:${HILTECH_MIGRATIONS_PATH:database/migrations}

server:
  port: ${HILTECH_SERVER_PORT:8080}

hiltech:
  identity:
    oidc:
      enabled: ${HILTECH_OIDC_ENABLED:false}
      issuer-uri: ${HILTECH_OIDC_ISSUER_URI:}
      audience: ${HILTECH_OIDC_AUDIENCE:}


  authorization:
    openfga:
      enabled: \${HILTECH_FGA_ENABLED:false}
      api-url: \${HILTECH_FGA_API_URL:}
      store-id: \${HILTECH_FGA_STORE_ID:}
      authorization-model-id: \${HILTECH_FGA_MODEL_ID:}
      request-timeout-ms: \${HILTECH_FGA_REQUEST_TIMEOUT_MS:2000}
      projector-poll-delay-ms: \${HILTECH_FGA_PROJECTOR_POLL_DELAY_MS:1000}
      claim-lease-seconds: \${HILTECH_FGA_CLAIM_LEASE_SECONDS:60}
