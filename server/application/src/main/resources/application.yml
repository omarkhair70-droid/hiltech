spring:
  application:
    name: hiltech-server
  datasource:
    url: ${HILTECH_DB_URL:jdbc:postgresql://localhost:5432/hiltech}
    username: ${HILTECH_DB_USER:hiltech}
    password: ${HILTECH_DB_PASSWORD:hiltech}
  flyway:
    enabled: true
    locations: filesystem:${HILTECH_MIGRATIONS_PATH:database/migrations}
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

server:
  port: ${HILTECH_SERVER_PORT:8080}

# Operational endpoints for the private Coolify pilot. Only health is exposed.
# Liveness measures the JVM process; readiness also checks PostgreSQL.
# Production authorization/identity/object-storage sign-off is a separate gate.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

hiltech:
  # Human authorization gate: disabled by default even when Android code is merged.
  # Enable only after S04A ownership/custody visibility review and rollout signoff.
  field:
    personal-issued-stock:
      enabled: ${HILTECH_FIELD_PERSONAL_ISSUED_STOCK_ENABLED:false}
    # S04B: pending-only reports, NOT a stock consumption.
    # OFF until role, review and warehouse reconciliation are approved.
    material-usage-report:
      enabled: ${HILTECH_FIELD_MATERIAL_USAGE_REPORT_ENABLED:false}
    # Read-only reviewer queue, OFF until authorized origin visibility is approved.
    material-usage-review-read:
      enabled: ${HILTECH_FIELD_MATERIAL_USAGE_REVIEW_READ_ENABLED:false}
    # Terminal review -> canonical consume/reject, OFF until reviewer authority is owner-approved.
    material-usage-reconciliation:
      enabled: ${HILTECH_FIELD_MATERIAL_USAGE_RECONCILIATION_ENABLED:false}
    # Assigned-work AssetTag lookup. Reuses canonical Asset authorization and narrows to exact WorkOrder custody.
    assigned-asset-lookup:
      enabled: ${HILTECH_FIELD_ASSIGNED_ASSET_LOOKUP_ENABLED:false}
    # Configurable structured engineering tests. No test family is hard-coded or seeded.
    engineering-tests:
      enabled: ${HILTECH_FIELD_ENGINEERING_TESTS_ENABLED:false}
    # Canonical Work document/drawing revisions. OFF until an organization binds an approval policy.
    work-documents:
      enabled: ${HILTECH_FIELD_WORK_DOCUMENTS_ENABLED:false}
    # Phase 6 completion submission. OFF until dependency/replay proof is green.
    completion:
      enabled: ${HILTECH_FIELD_COMPLETION_ENABLED:false}


  activity:
    cursor-signing-key: ${HILTECH_ACTIVITY_CURSOR_SIGNING_KEY:}

  approval:
    cursor-signing-key: ${HILTECH_APPROVAL_CURSOR_SIGNING_KEY:}

  inbox:
    cursor-signing-key: ${HILTECH_INBOX_CURSOR_SIGNING_KEY:}

  identity:
    oidc:
      enabled: ${HILTECH_OIDC_ENABLED:false}
      issuer-uri: ${HILTECH_OIDC_ISSUER_URI:}
      audience: ${HILTECH_OIDC_AUDIENCE:}
      native-client-id: ${HILTECH_OIDC_NATIVE_CLIENT_ID:hiltech-native}
    provisioning:
      keycloak:
        enabled: ${HILTECH_KEYCLOAK_PROVISIONING_ENABLED:false}
        admin-client-id: ${HILTECH_KEYCLOAK_ADMIN_CLIENT_ID:}
        admin-client-secret: ${HILTECH_KEYCLOAK_ADMIN_CLIENT_SECRET:}
        email-action-link-enabled: ${HILTECH_KEYCLOAK_EMAIL_ACTION_LINK_ENABLED:false}
    session:
      ttl-seconds: ${HILTECH_SESSION_TTL_SECONDS:43200}
      reauth-max-age-seconds: ${HILTECH_REAUTH_MAX_AGE_SECONDS:300}
      reauth-window-seconds: ${HILTECH_REAUTH_WINDOW_SECONDS:900}


  authorization:
    openfga:
      enabled: ${HILTECH_FGA_ENABLED:false}
      api-url: ${HILTECH_FGA_API_URL:}
      store-id: ${HILTECH_FGA_STORE_ID:}
      authorization-model-id: ${HILTECH_FGA_MODEL_ID:}
      request-timeout-ms: ${HILTECH_FGA_REQUEST_TIMEOUT_MS:2000}
      projector-poll-delay-ms: ${HILTECH_FGA_PROJECTOR_POLL_DELAY_MS:1000}
      claim-lease-seconds: ${HILTECH_FGA_CLAIM_LEASE_SECONDS:60}


  evidence:
    storage:
      enabled: ${HILTECH_EVIDENCE_STORAGE_ENABLED:false}
      endpoint: ${HILTECH_EVIDENCE_STORAGE_ENDPOINT:}
      region: ${HILTECH_EVIDENCE_STORAGE_REGION:}
      access-key: ${HILTECH_EVIDENCE_STORAGE_ACCESS_KEY:}
      secret-key: ${HILTECH_EVIDENCE_STORAGE_SECRET_KEY:}
      bucket: ${HILTECH_EVIDENCE_STORAGE_BUCKET:}
      upload-expiry-seconds: ${HILTECH_EVIDENCE_UPLOAD_EXPIRY_SECONDS:600}
      download-expiry-seconds: ${HILTECH_EVIDENCE_DOWNLOAD_EXPIRY_SECONDS:300}


  observability:
    enabled: ${HILTECH_OTEL_ENABLED:false}
    service-name: ${HILTECH_OTEL_SERVICE_NAME:hiltech-server}
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4317}
    exporter-timeout-ms: ${HILTECH_OTEL_EXPORTER_TIMEOUT_MS:5000}
