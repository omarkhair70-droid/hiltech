name: Phase 7 S04 — PO-linked canonical receiving contract

on:
  push:
    branches:
      - "phase7/s04-po-canonical-receipts-20261122"
    paths:
      - ".github/workflows/phase7-s04-po-receiving-contract.yml"
      - "database/migrations/V0050__procurement_po_receiving_link__phase7_slice04.sql"
      - "server/application/src/main/kotlin/com/hiltech/server/procurement/ProcurementPoReceivingGuard.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/procurement/PurchaseOrderIssuePersistence.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/procurement/PurchaseOrderLifecycleService.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/warehouse/ReceivingService.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/procurement/ProcurementPoReceivingGuardTest.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/procurement/PurchaseOrderLifecycleServiceTest.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/DatabaseMigrationContractTest.kt"
      - "docs/13-delivery/phase7/07_S04_PO_WAREHOUSE_RECEIVING_CHECKPOINT.md"
  pull_request:
    branches:
      - "phase7/s03-approval-po-preflight-20261122"
    paths:
      - ".github/workflows/phase7-s04-po-receiving-contract.yml"
      - "database/migrations/V0050__procurement_po_receiving_link__phase7_slice04.sql"
      - "server/application/src/main/kotlin/com/hiltech/server/procurement/**"
      - "server/application/src/main/kotlin/com/hiltech/server/warehouse/ReceivingService.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/procurement/**"
      - "server/application/src/test/kotlin/com/hiltech/server/DatabaseMigrationContractTest.kt"
      - "docs/13-delivery/phase7/07_S04_PO_WAREHOUSE_RECEIVING_CHECKPOINT.md"

concurrency:
  group: phase7-s04-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canonical-warehouse-receipt:
    name: PO receipt provenance, PostgreSQL and native compatibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify V0050, receipt guard, and existing PO cancellation
        env:
          HILTECH_DB_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
          HILTECH_DB_USER: hiltech
          HILTECH_DB_PASSWORD: hiltech
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.DatabaseMigrationContractTest \
            --tests com.hiltech.server.procurement.ProcurementPoReceivingGuardTest \
            --tests com.hiltech.server.procurement.PurchaseOrderLifecycleServiceTest \
            --no-daemon --console=plain
      - name: Compile Windows and Android clients against changed server contracts
        run: |
          ./gradlew :apps:desktopApp:compileKotlin :apps:androidApp:assembleDebug \
            --no-daemon --console=plain
