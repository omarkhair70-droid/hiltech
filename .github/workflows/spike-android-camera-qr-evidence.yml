name: Spike — Android Camera QR Evidence

on:
  push:
    branches:
      - "spike/android-camera-qr-evidence-20260918"
    paths:
      - "spikes/kmp-android-windows/**"
      - ".github/workflows/spike-android-camera-qr-evidence.yml"
  pull_request:
    paths:
      - "spikes/kmp-android-windows/**"
      - ".github/workflows/spike-android-camera-qr-evidence.yml"
  workflow_dispatch:

jobs:
  android-camera-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: spikes/kmp-android-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK and API 36 camera emulator
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "emulator"             "platforms;android-36"             "build-tools;36.0.0"             "system-images;android-36;google_apis;x86_64"

          echo no | "$AVDMANAGER" create avd             --force             --name hiltech-camera-api36             --package "system-images;android-36;google_apis;x86_64"             --device "pixel_6"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: QR asset lookup and upload-retry unit tests
        run: gradle :androidApp:testDebugUnitTest --stacktrace

      - name: Build Android debug APK
        run: gradle :androidApp:assembleDebug --stacktrace

      - name: Start emulator with virtual back camera
        shell: bash
        run: |
          set -euxo pipefail

          sudo chmod 666 /dev/kvm || true

          nohup "$ANDROID_HOME/emulator/emulator"             -avd hiltech-camera-api36             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -camera-back virtualscene             > /tmp/hiltech-camera-emulator.log 2>&1 &

          adb wait-for-device

          for i in $(seq 1 180); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOT" = "1" ]; then
              break
            fi
            sleep 1
          done

          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
            cat /tmp/hiltech-camera-emulator.log
            exit 1
          fi

      - name: Install spike APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find androidApp/build/outputs/apk/debug -name '*-debug.apk' | head -n 1)"
          test -n "$APK"
          adb install -r "$APK"

      - name: Permission prohibited and real capture flows
        shell: bash
        run: |
          set -euo pipefail

          PKG="com.hiltech.spike.android"
          ACTIVITY="$PKG/.camera.CameraEvidenceSpikeActivity"

          read_state () {
            adb shell run-as "$PKG" cat files/camera-spike-state.txt 2>/dev/null | tr -d '\r' || true
          }

          wait_state () {
            local EXPECTED="$1"
            local LIMIT="$2"
            local START
            START="$(date +%s)"

            while true; do
              VALUE="$(read_state)"
              echo "cameraState=[$VALUE]"

              if echo "$VALUE" | grep -q "state=$EXPECTED"; then
                return 0
              fi

              NOW="$(date +%s)"
              if [ $((NOW - START)) -ge "$LIMIT" ]; then
                echo "Timed out waiting for camera state $EXPECTED"
                return 1
              fi

              sleep 1
            done
          }

          cleanup_probe () {
            adb shell run-as "$PKG" rm -f files/camera-spike-state.txt >/dev/null 2>&1 || true
            adb shell run-as "$PKG" rm -rf files/evidence >/dev/null 2>&1 || true
          }

          # Bootstrap app data directory once.
          adb shell am start -W -n "$PKG/.MainActivity" >/dev/null
          adb shell am force-stop "$PKG"
          cleanup_probe

          # ---- Permission denied ----
          adb shell pm revoke "$PKG" android.permission.CAMERA >/dev/null 2>&1 || true
          adb shell am start -W -n "$ACTIVITY" --es mode capture >/dev/null
          wait_state "PERMISSION_DENIED" 15

          DENIED="$(read_state)"
          echo "$DENIED" | grep -q "fallback=MANUAL_ASSET_ID_ALLOWED"

          # ---- Camera prohibited by site policy ----
          adb shell pm grant "$PKG" android.permission.CAMERA
          cleanup_probe

          adb shell am start -W -n "$ACTIVITY" --es mode prohibited >/dev/null
          wait_state "CAMERA_PROHIBITED" 15

          PROHIBITED="$(read_state)"
          echo "$PROHIBITED" | grep -q "fallback=MANUAL_ASSET_ID_ALLOWED"
          echo "$PROHIBITED" | grep -q "manualAssetId=ASSET-FLUKE-03"

          if adb shell run-as "$PKG" test -f files/evidence/evidence-001.jpg; then
            echo "Camera-prohibited mode created image evidence"
            exit 1
          fi

          # ---- Real CameraX capture ----
          cleanup_probe
          adb shell pm grant "$PKG" android.permission.CAMERA

          adb shell am start -W -n "$ACTIVITY" --es mode capture >/dev/null
          wait_state "CAPTURED" 90

          STATE="$(read_state)"
          echo "$STATE" | grep -q "uploadState=PENDING_UPLOAD"

          META="$(adb shell run-as "$PKG" cat files/evidence/evidence-001.meta | tr -d '\r')"
          echo "$META"
          echo "$META" | grep -q "state=LOCAL_READY"
          echo "$META" | grep -q "uploadState=PENDING_UPLOAD"
          echo "$META" | grep -E -q "sha256=[0-9a-f]{64}"

          SIZE="$(adb exec-out run-as "$PKG" cat files/evidence/evidence-001.jpg | wc -c | tr -d ' ')"
          echo "capturedJpegBytes=$SIZE"

          if [ "$SIZE" -le 0 ]; then
            echo "Captured JPEG is empty"
            exit 1
          fi

          echo "HILTECH_CAMERA_EVIDENCE_PASS qr_asset_lookup=PASS permission_denied=PASS prohibited_mode=PASS camerax_capture=PASS local_file=PASS checksum_metadata=PASS upload_handoff=PASS"

      - name: Camera diagnostics on failure
        if: failure()
        shell: bash
        run: |
          adb logcat -d -t 1500 | grep -i -E 'CameraX|Camera2|ImageCapture|hiltech|CameraEvidence' || true
          cat /tmp/hiltech-camera-emulator.log || true
