name: Spike — Android Camera QR Evidence

on:
  push:
    branches:
      - "spike/android-camera-qr-evidence-20260918"
    paths:
      - "spikes/kmp-android-windows/**"
      - ".github/workflows/spike-android-camera-qr-evidence.yml"
      - ".github/scripts/spike-android-camera-evidence.sh"
  pull_request:
    paths:
      - "spikes/kmp-android-windows/**"
      - ".github/workflows/spike-android-camera-qr-evidence.yml"
      - ".github/scripts/spike-android-camera-evidence.sh"
  workflow_dispatch:

jobs:
  android-camera-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Prepare Android SDK for build
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: QR asset lookup and upload-retry unit tests
        working-directory: spikes/kmp-android-windows
        run: gradle :androidApp:testDebugUnitTest --stacktrace

      - name: Build Android debug APK
        working-directory: spikes/kmp-android-windows
        run: gradle :androidApp:assembleDebug --stacktrace

      - name: Free hosted-runner disk before emulator
        shell: bash
        run: |
          gradle --stop || true
          echo "Disk before cleanup:"
          df -h /
          du -sh "$HOME/.gradle/caches" 2>/dev/null || true

          # APK is already built. The emulator scenario only needs the APK + adb,
          # so Gradle dependency/transforms caches are disposable at this point.
          rm -rf "$HOME/.gradle/caches" || true
          rm -rf "$HOME/.gradle/wrapper/dists" || true
          rm -rf /tmp/.gradle* 2>/dev/null || true

          echo "Disk after cleanup:"
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Real API 36 CameraX evidence lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back virtualscene
          disable-animations: true
          script: bash .github/scripts/spike-android-camera-evidence.sh
