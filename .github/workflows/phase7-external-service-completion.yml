name: Phase 7 — External service purchase end-to-end contracts

on:
  push:
    branches:
      - "phase7/s07c-service-order-approval-20261123"
  pull_request:
    branches:
      - "phase7/s07b-service-supplier-quote-20261123"

permissions:
  contents: read

concurrency:
  group: phase7-external-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-end-to-end:
    name: Service approval, acceptance, invoice, PostgreSQL and native compilers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run complete Phase 7 external-service PostgreSQL and guarded server tests
        env:
          HILTECH_DB_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
          HILTECH_DB_USER: hiltech
          HILTECH_DB_PASSWORD: hiltech
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
        run: |
          # The migration-contract test deliberately upgrades V0033 -> latest.
          # Run it before other PostgreSQL tests to avoid class scheduling races.
          ./gradlew :server:application:test \
            --tests com.hiltech.server.DatabaseMigrationContractTest \
            --no-daemon --console=plain
          ./gradlew :server:application:test \
            --tests com.hiltech.server.procurement.ServicePurchaseNeedServiceTest \
            --tests com.hiltech.server.procurement.ServiceSupplierSourcingServiceTest \
            --tests com.hiltech.server.procurement.ServiceQuoteProtectedDocumentTest \
            --tests com.hiltech.server.procurement.ServiceOrderApprovalTest \
            --tests com.hiltech.server.procurement.ServiceDeliveryInvoiceSafetyTest \
            --tests com.hiltech.server.procurement.ServiceInvoiceMatchRulesTest \
            --tests com.hiltech.server.procurement.ServicePurchaseProtectedDocumentTest \
            --tests com.hiltech.server.procurement.ServiceSupplierCommunicationTest \
            --tests com.hiltech.server.procurement.ServiceSourcingPostgresIntegrationTest \
            --tests com.hiltech.server.documents.persistence.ServiceRestrictedEvidenceReservationTest \
            --no-daemon --console=plain
      - name: Full backend unit and Spring Modulith architecture verification
        env:
          HILTECH_DB_CONTRACT_TEST: "0"
        run: |
          # PostgreSQL versioned-upgrade contract runs in the previous step on
          # a fresh disposable DB. Other server/Modulith tests must still run,
          # without rerunning the V0033 baseline against already-migrated SQL.
          ./gradlew :server:application:test --rerun-tasks \
            --no-daemon --console=plain
      - name: Compile Android APK, Windows desktop and shared native tests
        run: |
          ./gradlew :shared:core:desktopTest :apps:desktopApp:compileKotlin \
            :apps:androidApp:assembleDebug --no-daemon --console=plain
