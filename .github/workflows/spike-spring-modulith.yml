name: Spike — Spring Modulith

on:
  push:
    branches:
      - "spike/spring-modulith-20260918"
    paths:
      - "spikes/spring-modulith/**"
      - ".github/workflows/spike-spring-modulith.yml"
  pull_request:
    paths:
      - "spikes/spring-modulith/**"
      - ".github/workflows/spike-spring-modulith.yml"
  workflow_dispatch:

jobs:
  modulith:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/spring-modulith

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Module verification and restart recovery tests
        run: gradle test --stacktrace
