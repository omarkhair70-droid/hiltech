name: Integration — Phase 7 S06 PO port backport full proof

on:
  push:
    branches:
      - integration/phase7-s06-policy-boundary-backport-20261123

permissions:
  contents: read

concurrency:
  group: phase7-boundary-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-and-backend:
    name: Spring Modulith + full backend test suite
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Run ArchitectureTest and full server unit suite
        run: ./gradlew :server:application:test --no-daemon --no-configuration-cache --console=plain
      - name: Retain test failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-integrator-boundary-failure
          path: |
            server/application/build/reports/tests/test/
            server/application/build/test-results/test/
          if-no-files-found: warn
          retention-days: 7

  postgres-and-guard:
    name: V0039–V0060 disposable PostgreSQL and canonical PO receiving
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HILTECH_DB_CONTRACT_TEST: "1"
      HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
      HILTECH_DB_USER: hiltech
      HILTECH_DB_PASSWORD: hiltech
      HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Migrate disposable database then verify PO guard
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.DatabaseMigrationContractTest \
            --tests com.hiltech.server.procurement.ProcurementPoReceivingGuardTest \
            --tests com.hiltech.server.procurement.PoReceivingDeliveryNoteEvidenceTargetAdapterTest \
            --rerun-tasks --no-daemon --no-configuration-cache --console=plain
