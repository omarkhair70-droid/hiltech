name: Spike — Windows Packaging Update Rollback

on:
  push:
    branches:
      - "spike/windows-update-20260918"
    paths:
      - "spikes/kmp-android-windows/**"
      - ".github/workflows/spike-windows-update.yml"
  pull_request:
    paths:
      - "spikes/kmp-android-windows/**"
      - ".github/workflows/spike-windows-update.yml"
  workflow_dispatch:

jobs:
  windows-lifecycle:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spikes/kmp-android-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build v0.1.0 MSI
        shell: pwsh
        run: gradle :desktopApp:packageMsi -PhiltechVersion=0.1.0 --stacktrace

      - name: Real Windows install update rollback lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-Msi {
            $msi = Get-ChildItem -Path "desktopApp\build\compose\binaries\main\msi" -Filter "*.msi" |
              Select-Object -First 1
            if (-not $msi) {
              throw "MSI package not found"
            }
            return $msi.FullName
          }

          function Get-InstalledExe {
            $candidates = @(
              "$env:ProgramFiles\HILTECHSpike\HILTECHSpike.exe",
              "${env:ProgramFiles(x86)}\HILTECHSpike\HILTECHSpike.exe"
            )

            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) {
                return $candidate
              }
            }

            $found = Get-ChildItem -Path $env:ProgramFiles -Filter "HILTECHSpike.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $found) {
              throw "Installed HILTECHSpike.exe not found"
            }

            return $found.FullName
          }

          function Invoke-MsiInstall([string] $Msi) {
            $arguments = "/i `"$Msi`" /qn /norestart"
            $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "MSI install failed with exit code $($process.ExitCode): $Msi"
            }
          }

          function Invoke-MsiUninstall([string] $Msi) {
            $arguments = "/x `"$Msi`" /qn /norestart"
            $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "MSI uninstall failed with exit code $($process.ExitCode): $Msi"
            }
          }

          function Invoke-App([string] $Exe, [string[]] $Arguments) {
            $process = Start-Process -FilePath $Exe -ArgumentList $Arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Packaged app probe failed with exit code $($process.ExitCode)"
            }
          }

          function Assert-FileValue([string] $Path, [string] $Expected) {
            if (-not (Test-Path $Path)) {
              throw "Expected file missing: $Path"
            }

            $actual = (Get-Content -Raw $Path).Trim()
            if ($actual -ne $Expected) {
              throw "Expected '$Expected' at $Path but got '$actual'"
            }
          }

          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signTool) {
            throw "signtool.exe not found"
          }

          $certificate = New-SelfSignedCertificate             -Type CodeSigningCert             -Subject "CN=HILTECH Spike Test Signing"             -CertStoreLocation "Cert:\CurrentUser\My"             -KeyExportPolicy Exportable             -NotAfter (Get-Date).AddDays(2)

          $root = New-Object System.Security.Cryptography.X509Certificates.X509Store("Root", "CurrentUser")
          $root.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $root.Add($certificate)
          $root.Close()

          function Sign-Msi([string] $Msi) {
            & $signTool.FullName sign /sha1 $certificate.Thumbprint /s My /fd SHA256 $Msi
            if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed"
            }

            & $signTool.FullName verify /pa /v $Msi
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verify failed"
            }
          }

          $dataDir = Join-Path $env:LOCALAPPDATA "HILTECHSpike"
          $stateFile = Join-Path $dataDir "state.txt"
          $versionFile = Join-Path $dataDir "version.txt"
          $deepLinkFile = Join-Path $dataDir "last-deep-link.txt"

          if (Test-Path $dataDir) {
            Remove-Item $dataDir -Recurse -Force
          }
          if (Test-Path "HKCU:\Software\Classes\hiltech") {
            Remove-Item "HKCU:\Software\Classes\hiltech" -Recurse -Force
          }

          # ---- v0.1 install ----
          $v1Built = Get-Msi
          $v1 = Join-Path $env:RUNNER_TEMP "HILTECHSpike-0.1.0.msi"
          Copy-Item $v1Built $v1 -Force
          Sign-Msi $v1
          Invoke-MsiInstall $v1

          $exeV1 = Get-InstalledExe
          Invoke-App $exeV1 @("--probe-version")
          Assert-FileValue $versionFile "0.1.0"

          Invoke-App $exeV1 @("--probe-write", "state-from-v1")
          Assert-FileValue $stateFile "state-from-v1"

          Invoke-App $exeV1 @("--register-protocol")
          $command = (Get-Item "HKCU:\Software\Classes\hiltech\shell\open\command").GetValue("")
          if (-not $command -or $command -notmatch "HILTECHSpike\.exe") {
            throw "hiltech:// protocol registration did not target packaged app"
          }

          Start-Process "hiltech://work/WO-42"

          $deadline = (Get-Date).AddSeconds(15)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $deepLinkFile)) {
            Start-Sleep -Milliseconds 250
          }
          Assert-FileValue $deepLinkFile "hiltech://work/WO-42"

          Invoke-MsiUninstall $v1
          Assert-FileValue $stateFile "state-from-v1"

          # ---- v0.2 update target ----
          gradle clean :desktopApp:packageMsi -PhiltechVersion=0.2.0 --stacktrace
          if ($LASTEXITCODE -ne 0) {
            throw "v0.2 Gradle package failed"
          }

          $v2Built = Get-Msi
          $v2 = Join-Path $env:RUNNER_TEMP "HILTECHSpike-0.2.0.msi"
          Copy-Item $v2Built $v2 -Force
          Sign-Msi $v2
          Invoke-MsiInstall $v2

          $exeV2 = Get-InstalledExe
          Invoke-App $exeV2 @("--probe-version")
          Assert-FileValue $versionFile "0.2.0"
          Assert-FileValue $stateFile "state-from-v1"

          # ---- rollback to v0.1 ----
          Invoke-MsiUninstall $v2
          Assert-FileValue $stateFile "state-from-v1"

          Invoke-MsiInstall $v1
          $exeRollback = Get-InstalledExe
          Invoke-App $exeRollback @("--probe-version")
          Assert-FileValue $versionFile "0.1.0"
          Assert-FileValue $stateFile "state-from-v1"

          # ---- final uninstall must not silently destroy user data ----
          Invoke-MsiUninstall $v1
          Assert-FileValue $stateFile "state-from-v1"

          Write-Host "HILTECH_WINDOWS_LIFECYCLE_PASS install=PASS signature=PASS deep_link=PASS update=PASS rollback=PASS state_preserved=PASS"

          # CI cleanup.
          if (Test-Path "HKCU:\Software\Classes\hiltech") {
            Remove-Item "HKCU:\Software\Classes\hiltech" -Recurse -Force
          }
          if (Test-Path $dataDir) {
            Remove-Item $dataDir -Recurse -Force
          }
          Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force
