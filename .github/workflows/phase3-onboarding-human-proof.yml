name: Phase 3 — Onboarding Human Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "shared/**"
      - "server/application/src/main/kotlin/com/hiltech/server/people/**"
      - "scripts/ci/phase3_android_onboarding_shell_smoke.sh"
      - ".github/workflows/phase3-onboarding-human-proof.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-onboarding-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Render employee and People/Admin onboarding flows
        env:
          HILTECH_PHASE3_ONBOARDING_EVIDENCE_DIR: ${{ github.workspace }}/build/reports/phase3-onboarding
        run: |
          xvfb-run -a ./gradlew :apps:desktopApp:renderPhase3OnboardingEvidence \
            | tee /tmp/hiltech-phase3-desktop.log
          grep -q "HILTECH_PHASE3_DESKTOP_ONBOARDING_RENDER_PASS" \
            /tmp/hiltech-phase3-desktop.log
          test -s build/reports/phase3-onboarding/desktop-employee-preboarding.png
          test -s build/reports/phase3-onboarding/desktop-people-admin-onboarding.png

      - name: Upload Desktop onboarding evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hiltech-phase3-desktop-onboarding-evidence
          path: build/reports/phase3-onboarding/*.png
          if-no-files-found: error
          retention-days: 30

  android-onboarding-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Build Android debug evidence APK
        run: |
          ./gradlew :apps:androidApp:assembleDebug \
            -Philtech.apiBaseUrl=https://api.hiltech.invalid \
            -Philtech.oidcIssuerUri=https://identity.hiltech.invalid/realms/hiltech

      - name: Free runner disk before emulator
        shell: bash
        run: |
          ./gradlew --stop || true
          rm -rf "$HOME/.gradle/caches" || true
          rm -rf "$HOME/.gradle/wrapper/dists" || true
          df -h /

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render Arabic-first employee onboarding flow
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/ci/phase3_android_onboarding_shell_smoke.sh

      - name: Verify Android onboarding evidence
        run: |
          test -s build/reports/phase3-onboarding/android-preboarding-ar.png

      - name: Upload Android onboarding evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hiltech-phase3-android-onboarding-evidence
          path: build/reports/phase3-onboarding/*.png
          if-no-files-found: error
          retention-days: 30
