name: Phase 6 — Native Material Usage Offline Replay

on:
  pull_request:
    branches:
      - main
      - phase6/s04c-controlled-document-revisions-20261122
      - phase6/s06-durable-recovery-20261122
    paths:
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/field/FieldMaterialUsageQueue.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/local/LocalDaos.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/sync/KtorPendingCommandTransport.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/AssignedWorkSection.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/HiltechShell.kt"
      - "shared/core/src/desktopTest/kotlin/com/hiltech/shared/core/field/FieldMaterialUsageQueueTest.kt"
      - "shared/core/src/desktopTest/kotlin/com/hiltech/shared/core/sync/KtorPendingCommandTransportTest.kt"
      - "apps/androidApp/src/main/kotlin/com/hiltech/android/HiltechApplication.kt"
      - "apps/androidApp/src/main/kotlin/com/hiltech/android/MainActivity.kt"
      - "apps/androidApp/build.gradle.kts"
      - ".github/workflows/phase6-material-usage-offline.yml"
      - "docs/13-delivery/phase6/12_SLICE04B_NATIVE_MATERIAL_USAGE_OFFLINE_REPLAY_2026-11-22.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-usage-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Verify server report contract and durable client replay
        run: >
          ./gradlew
          :server:application:test
          --tests com.hiltech.server.work.FieldMaterialUsageReportServiceTest
          :shared:core:desktopTest
          --tests com.hiltech.shared.core.field.FieldMaterialUsageQueueTest
          --tests com.hiltech.shared.core.sync.KtorPendingCommandTransportTest
          --no-configuration-cache --console=plain
      - name: Compile Android with material reporting enabled
        run: >
          ./gradlew
          :apps:androidApp:compileDebugKotlin
          -Philtech.personalIssuedStockEnabled=true
          -Philtech.materialUsageReportingEnabled=true
          -Philtech.assignedAssetLookupEnabled=true
          -Philtech.engineeringTestsEnabled=true
          --no-configuration-cache --console=plain
