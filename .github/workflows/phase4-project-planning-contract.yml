name: Phase 4 — Project Planning Structure

on:
  pull_request:
    branches:
      - main
    paths:
      - "database/migrations/V0022__projects_planning__slice02.sql"
      - "server/application/src/main/kotlin/com/hiltech/server/projects/**"
      - "server/application/src/test/kotlin/com/hiltech/server/projects/**"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/projects/**"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/projects/**"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/ProjectControlSection.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/ProjectPlanningSection.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/HiltechShell.kt"
      - "apps/desktopApp/**"
      - ".github/workflows/phase4-project-planning-contract.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project-planning-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Start disposable PostgreSQL and OpenFGA
        shell: bash
        run: |
          docker compose \
            --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml \
            up -d postgres openfga-migrate openfga

      - name: Wait for OpenFGA
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml logs --no-color openfga
          exit 1

      - name: Load canonical authorization model
        shell: bash
        run: |
          docker compose \
            --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml \
            --profile tools run --rm openfga-cli \
            store create --model /contracts/first-slice-model.fga \
            | tee /tmp/hiltech-phase4-planning-openfga.json

          grep -q 'authorization_model_id' /tmp/hiltech-phase4-planning-openfga.json

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/hiltech-phase4-planning-openfga.json", encoding="utf-8") as source:
              payload = json.load(source)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write(f'HILTECH_FGA_STORE_ID={payload["store"]["id"]}\n')
              target.write(f'HILTECH_FGA_MODEL_ID={payload["model"]["authorization_model_id"]}\n')
          PY

      - name: Verify planning persistence authorization and transitions
        env:
          HILTECH_PROJECTS_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://127.0.0.1:5432/hiltech
          HILTECH_DB_USER: hiltech_app
          HILTECH_DB_PASSWORD: hiltech-app-local
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
          HILTECH_FGA_ENABLED: "true"
          HILTECH_FGA_API_URL: http://127.0.0.1:8082
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.projects.ProjectsPostgresOpenFgaContractTest \
            --rerun-tasks \
            --console=plain

      - name: Verify shared planning client
        run: |
          ./gradlew :shared:core:desktopTest \
            --tests com.hiltech.shared.core.projects.PlanningApiClientTest \
            --console=plain

      - name: Contract test reports on failure
        if: failure()
        shell: bash
        run: |
          find server/application/build/test-results shared/core/build/test-results \
            -type f -name '*.xml' -print -exec cat {} \; || true

      - name: Local platform logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml logs --no-color --tail=300 postgres openfga

      - name: Stop disposable platform
        if: always()
        shell: bash
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml down -v --remove-orphans

  desktop-project-planning-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Render planning structure flows
        env:
          HILTECH_PHASE4_PLANNING_EVIDENCE_DIR: ${{ github.workspace }}/build/reports/phase4-planning
        run: |
          xvfb-run -a ./gradlew :apps:desktopApp:renderPhase4PlanningEvidence \
            | tee /tmp/hiltech-phase4-planning.log
          grep -q "HILTECH_PHASE4_PLANNING_RENDER_PASS" /tmp/hiltech-phase4-planning.log
          test -s build/reports/phase4-planning/desktop-project-planning-tree.png
          test -s build/reports/phase4-planning/desktop-project-ready-gate.png
          test -s build/reports/phase4-planning/desktop-project-plan-conflict.png

      - name: Upload Project planning evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hiltech-phase4-project-planning-evidence
          path: build/reports/phase4-planning/*.png
          if-no-files-found: error
          retention-days: 30
