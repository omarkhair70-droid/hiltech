name: Spike — PostgreSQL jOOQ Ledger

on:
  push:
    branches:
      - "spike/postgres-jooq-ledger-20260918"
    paths:
      - "spikes/postgres-jooq-ledger/**"
      - ".github/workflows/spike-postgres-jooq-ledger.yml"
  pull_request:
    paths:
      - "spikes/postgres-jooq-ledger/**"
      - ".github/workflows/spike-postgres-jooq-ledger.yml"
  workflow_dispatch:

jobs:
  ledger:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech_spike
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech_spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_URL: jdbc:postgresql://localhost:5432/hiltech_spike
      PG_USER: hiltech
      PG_PASSWORD: hiltech

    defaults:
      run:
        working-directory: spikes/postgres-jooq-ledger

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: PostgreSQL ledger concurrency tests
        run: gradle test --stacktrace
