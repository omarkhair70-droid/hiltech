name: Contract — OpenFGA First Slice

on:
  push:
    branches:
      - main
    paths:
      - "docs/13-delivery/first-slice-contract-pack/openfga/**"
      - ".github/workflows/contract-openfga-first-slice.yml"
  pull_request:
    paths:
      - "docs/13-delivery/first-slice-contract-pack/openfga/**"
      - ".github/workflows/contract-openfga-first-slice.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  model-contract:
    name: Validate model + authorization fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test OpenFGA model
        uses: openfga/action-openfga-test@e89aa8259796cd5ee5c1b1ae7d72c401029cb947 # v0.1.2
        with:
          test_path: docs/13-delivery/first-slice-contract-pack/openfga/first-slice-model.fga.yaml
          fga_cli_version: v0.7.20

      - name: Contract marker
        run: echo "HILTECH_OPENFGA_CONTRACT_PASS model=first-slice checks=PASS cli=v0.7.20"
