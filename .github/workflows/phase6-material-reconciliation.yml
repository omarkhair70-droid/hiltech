name: Phase 6 — Material Usage Reconciliation (Canonical Consume)

on:
  pull_request:
    branches:
      - main
      - phase6/s04b-warehouse-review-read-20261121
    paths:
      - "server/application/src/main/kotlin/com/hiltech/server/warehouse/FieldMaterialUsageReconciliation.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/warehouse/FieldMaterialUsageWarehouseReview.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/work/FieldMaterialUsageReportPersistence.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/warehouse/FieldMaterialUsageReconciliationServiceTest.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/warehouse/ReservationOperatorScenario.kt"
      - "database/migrations/V0035__field_material_usage_reconciliation__phase6_slice04b.sql"
      - ".github/workflows/phase6-material-reconciliation.yml"
      - "server/application/src/main/resources/application.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Verify material reconciliation service and review queue
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.warehouse.FieldMaterialUsageReconciliationServiceTest \
            --tests com.hiltech.server.warehouse.FieldUsageWarehouseReviewServiceTest \
            --no-configuration-cache --console=plain

  reconciliation-postgres-openfga:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Start disposable PostgreSQL and OpenFGA
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml \
            up -d postgres openfga-migrate openfga
      - name: Wait for OpenFGA
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml logs --no-color openfga
          exit 1
      - name: Load canonical authorization model
        shell: bash
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml --profile tools run --rm openfga-cli \
            store create --model /contracts/first-slice-model.fga \
            | tee /tmp/hiltech-material-reconcile-openfga.json
          python3 - <<'PY'
          import json
          import os
          with open("/tmp/hiltech-material-reconcile-openfga.json", encoding="utf-8") as f:
              payload = json.load(f)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f'HILTECH_FGA_STORE_ID={payload["store"]["id"]}\n')
              env.write(f'HILTECH_FGA_MODEL_ID={payload["model"]["authorization_model_id"]}\n')
          PY
      - name: Prove immutable report -> canonical consume on PostgreSQL and OpenFGA
        env:
          HILTECH_PROJECTS_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://127.0.0.1:5432/hiltech
          HILTECH_DB_USER: hiltech_app
          HILTECH_DB_PASSWORD: hiltech-app-local
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
          HILTECH_FGA_ENABLED: "true"
          HILTECH_FGA_API_URL: http://127.0.0.1:8082
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.projects.ProjectsPostgresOpenFgaContractTest \
            --rerun-tasks --no-configuration-cache --console=plain
      - name: Test report on failure
        if: failure()
        run: |
          find server/application/build/test-results/test \
            -type f -name '*.xml' -print -exec cat {} \; || true
      - name: Dispose PostgreSQL and OpenFGA
        if: always()
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml down -v --remove-orphans
