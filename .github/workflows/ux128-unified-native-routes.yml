name: UX-128 Unified Native Workspace Routes

on:
  push:
    branches:
      - "ux/128-native-route-integration-p7to13-20261123"
      - "integration/hiltech-closeout-github-20261123"
      - "ux/128-closeout-delta-on-devops215-20261123"
  pull_request:
    branches:
      - "integration/phase7to11-native-executive13ab-20261123"
      - "integration/hiltech-closeout-github-20261123"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux128-unified-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-route-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Exact checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Pinned Gradle setup
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Shared source-grant tests and Windows/Android native compilers
        run: |
          ./gradlew :shared:core:desktopTest \
            :apps:desktopApp:compileKotlin \
            :apps:androidApp:assembleDebug \
            --no-configuration-cache --no-daemon --console=plain
