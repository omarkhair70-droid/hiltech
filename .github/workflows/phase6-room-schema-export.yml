name: Phase 6 — Room v2 schema export (temporary evidence)

on:
  pull_request:
    branches: [main]
    paths:
      - "shared/core/src/**"
      - "shared/core/build.gradle.kts"
      - ".github/workflows/phase6-room-schema-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-room-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Generate current Room schemas with native KSP
        run: |
          ./gradlew :shared:core:desktopTest --console=plain
          test -s shared/core/schemas/com.hiltech.shared.core.local.HiltechLocalDatabase/2.json
      - name: Export generated schema as review artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: phase6-room-v2-generated-schema
          path: shared/core/schemas/com.hiltech.shared.core.local.HiltechLocalDatabase/2.json
          if-no-files-found: warn
