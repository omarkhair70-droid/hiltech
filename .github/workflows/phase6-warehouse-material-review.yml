name: Phase 6 — Warehouse Material Review Read (No Consume)

on:
  pull_request:
    branches: [main]
    paths:
      - "server/application/src/main/kotlin/com/hiltech/server/warehouse/FieldMaterialUsageWarehouseReview*"
      - "server/application/src/test/kotlin/com/hiltech/server/warehouse/FieldUsageWarehouseReview*"
      - "server/application/src/test/kotlin/com/hiltech/server/warehouse/ReservationOperatorScenario.kt"
      - ".github/workflows/phase6-warehouse-material-review.yml"
      - "server/application/src/main/resources/application.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  material-review-read-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.5.0"
      - name: Verify warehouse report source and restricted origin review
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.warehouse.FieldUsageWarehouseReviewServiceTest \
            --no-configuration-cache --console=plain

  warehouse-review-postgres-openfga:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.5.0"
      - name: Start disposable PostgreSQL and OpenFGA
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml \
            up -d postgres openfga-migrate openfga
      - name: Wait for OpenFGA
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml logs --no-color openfga
          exit 1
      - name: Load canonical authorization model
        shell: bash
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml --profile tools run --rm openfga-cli \
            store create --model /contracts/first-slice-model.fga \
            | tee /tmp/hiltech-warehouse-review-openfga.json
          python3 - <<'PY'
          import json
          import os
          with open("/tmp/hiltech-warehouse-review-openfga.json", encoding="utf-8") as f:
              payload = json.load(f)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f'HILTECH_FGA_STORE_ID={payload["store"]["id"]}\n')
              env.write(f'HILTECH_FGA_MODEL_ID={payload["model"]["authorization_model_id"]}\n')
          PY
      - name: Verify exact-origin warehouse pending queue on PostgreSQL and OpenFGA
        env:
          HILTECH_PROJECTS_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://127.0.0.1:5432/hiltech
          HILTECH_DB_USER: hiltech_app
          HILTECH_DB_PASSWORD: hiltech-app-local
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
          HILTECH_FGA_ENABLED: "true"
          HILTECH_FGA_API_URL: http://127.0.0.1:8082
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.projects.ProjectsPostgresOpenFgaContractTest \
            --rerun-tasks --no-configuration-cache --console=plain
      - name: Test report on failure
        if: failure()
        run: |
          find server/application/build/test-results/test \
            -type f -name '*.xml' -print -exec cat {} \; || true
      - name: Platform logs on failure
        if: failure()
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml \
            logs --no-color --tail=300 postgres openfga
      - name: Dispose PostgreSQL and OpenFGA
        if: always()
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml down -v --remove-orphans
