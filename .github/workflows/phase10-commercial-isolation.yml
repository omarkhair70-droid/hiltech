name: Phase 10 — Commercial isolation and native contracts

on:
  push:
    branches: ["integration/phase7-finance8i-native-payroll9-sales10-20261123", "integration/phase7-finance8i-native-payroll-sales10-service11-20261123", "integration/phase7to11-native-executive13ab-20261123"]
  pull_request:
    paths:
      - "database/phase10/**"
      - "server/application/src/main/kotlin/com/hiltech/server/commercial/**"
      - "server/application/src/main/kotlin/com/hiltech/server/documents/CommercialEvidenceTargetPort.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/documents/EvidenceLifecycleApi.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/documents/EvidencePersistence.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/documents/persistence/JdbcEvidencePersistence.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/commercial/**"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/commercial/**"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/CommercialWorkbenchSection.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/CommercialDealWorkspaceSection.kt"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/commercial/**"
      - ".github/workflows/phase10-commercial-isolation.yml"
  workflow_dispatch:

concurrency:
  group: phase10-commercial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commercial-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      HILTECH_DB_CONTRACT_TEST: "1"
      HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
      HILTECH_DB_USER: hiltech
      HILTECH_DB_PASSWORD: hiltech
      HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Validate unnumbered commercial DDL shape before SQL execution
        run: python3 database/phase10/validate_schema_static.py
      - name: Canonical Flyway and commercial contract unit tests
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.DatabaseMigrationContractTest \
            --tests com.hiltech.server.commercial.CommercialContractShapeTest \
            --no-configuration-cache --console=plain
      - name: Prove canonical migrated V0071 schema and commercial positive/negative contracts
        run: |
          docker run --rm --network host \
            -v "$PWD":/repo -e PGPASSWORD=hiltech postgres:18.6 \
            psql -h 127.0.0.1 -U hiltech -d hiltech \
            -v ON_ERROR_STOP=1 \
            -f /repo/database/phase10/commercial_schema_assertions.sql \
            -f /repo/database/phase10/commercial_negative_contract.sql \
            -f /repo/database/phase10/commercial_positive_contract.sql
      - name: Live authority revocation and Evidence eligibility on disposable PostgreSQL
        env:
          HILTECH_COMMERCIAL_DB_TEST: "1"
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.commercial.CommercialPostgresAuthorizationContractTest \
            --rerun-tasks --no-configuration-cache --console=plain
      - name: Native KMP desktop and customer quote number contract
        run: |
          ./gradlew :shared:core:desktopTest :shared:core:compileKotlinDesktop \
            --no-configuration-cache --console=plain
      - name: Capture test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10-commercial-contract-reports
          path: |
            server/application/build/test-results/test/
            shared/core/build/test-results/
          if-no-files-found: ignore
