name: Phase 8 8H employee advance and imprest policy review

on:
  push:
    branches:
      - "phase8/finance-8h-advance-imprest-policy-review-20261123"
  pull_request:
    branches:
      - "phase8/finance-8g-expense-documentation-review-20261123"

concurrency:
  group: finance8h-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-company-money-requests:
    name: Advance versus Imprest immutable company review
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify Advance and Imprest policy guards + parent review on disposable PostgreSQL
        env:
          HILTECH_DB_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
          HILTECH_DB_USER: hiltech
          HILTECH_DB_PASSWORD: hiltech
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.finance.FinanceEmployeeDraftMigrationContractTest \
            --tests com.hiltech.server.finance.FinanceEmployeeDraftServiceTest \
            --tests com.hiltech.server.finance.FinanceEmployeeReviewServiceTest \
            --tests com.hiltech.server.finance.FinanceMoneyDraftPolicyApprovalSubjectTest \
            --tests com.hiltech.server.finance.FinanceMoneyDraftPolicyReviewServiceTest \
            --tests com.hiltech.server.finance.FinanceExpenseDocumentationStatusServiceTest \
            --tests com.hiltech.server.finance.FinanceExpenseDocumentationReviewServiceTest \
            --tests com.hiltech.server.finance.FinanceExpenseDocumentationSourcePostgresContractTest \
            --no-daemon --console=plain
      - name: Verify separate typed native policy request and receipt review contracts
        run: |
          ./gradlew :shared:core:desktopTest \
            --tests com.hiltech.shared.core.finance.FinanceMoneyPolicyReviewApiClientTest \
            --tests com.hiltech.shared.core.finance.FinanceExpenseDocumentationReviewApiClientTest \
            --no-daemon --console=plain
      - name: Compile Finance on real Windows/Android app targets
        run: |
          ./gradlew :apps:desktopApp:compileKotlin :apps:androidApp:assembleDebug \
            --no-daemon --console=plain
