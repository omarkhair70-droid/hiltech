name: DevOps - Payroll9 to Finance8 review envelope integration

on:
  push:
    branches:
      - integration/hiltech-payroll-finance-review-intake-20261123
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payroll-finance-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payroll-finance-review:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HILTECH_PAYROLL_9A_CONTRACT_TEST: "1"
      HILTECH_DB_CONTRACT_TEST: "1"
      HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
      HILTECH_DB_USER: hiltech
      HILTECH_DB_PASSWORD: hiltech
      HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
      HILTECH_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Payroll9 real released-run to Finance8 exact review-envelope contract
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.payroll.Payroll9bDraftPostgresContractTest \
            --tests com.hiltech.server.finance.FinancePayrollReviewIntakePolicyTest \
            --tests com.hiltech.server.commercial.CommercialFinanceServiceSourcePostgresContractTest \
            --rerun-tasks --no-daemon --no-configuration-cache --console=plain
      - name: Only sanitized failing test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payroll-finance-review-failed-tests
          path: server/application/build/test-results/test/
          if-no-files-found: warn
          retention-days: 7
