name: DevOps — Phase 8 provisional V0061 migration integration

on:
  push:
    branches: [devops/phase8-v0061-migration-gate-20261122]

permissions:
  contents: read

jobs:
  migrations:
    name: Full P7 + P8 V0061 additive PostgreSQL and Finance source check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HILTECH_DB_CONTRACT_TEST: "1"
      HILTECH_FINANCE_PAYABLE_DB_CONTRACT_TEST: "1"
      HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
      HILTECH_DB_USER: hiltech
      HILTECH_DB_PASSWORD: hiltech
      HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Rehearse all migrations through provisional V0061, then Finance guard
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.DatabaseMigrationContractTest \
            --tests com.hiltech.server.finance.FinancePayableMigrationContractTest \
            --tests com.hiltech.server.finance.FinancePayableCandidateServiceTest \
            --rerun-tasks --no-daemon --no-configuration-cache --console=plain
      - name: Preserve failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-v0061-integration-failure-evidence
          path: server/application/build/test-results/test/
          if-no-files-found: warn
          retention-days: 7
