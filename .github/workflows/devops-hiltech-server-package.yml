name: DevOps - HILTECH server package proof

on:
  pull_request:
    paths:
      - ".github/workflows/devops-hiltech-server-package.yml"
      - "server/**"
      - "database/migrations/**"
      - "scripts/devops/**"
      - "infrastructure/coolify/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devops-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-prove-bootjar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      HILTECH_DB_CONTRACT_TEST: "1"
      HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
      HILTECH_DB_USER: hiltech
      HILTECH_DB_PASSWORD: hiltech
      HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure frozen Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Prove database migration on disposable PostgreSQL
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.DatabaseMigrationContractTest \
            --rerun-tasks

      - name: Generate source from validated PostgreSQL schema
        shell: bash
        run: |
          set -euo pipefail
          # jOOQ generation is not configuration-cache compatible.
          # A bounded retry handles transient upstream Maven Central HTTP 429.
          for attempt in 1 2 3; do
            if ./gradlew :server:application:verifyJooqGeneration \
                --no-configuration-cache --console=plain 2>&1 | tee /tmp/hiltech-jooq.log; then
              exit 0
            fi
            if ! grep -Eqi '429|Too Many Requests' /tmp/hiltech-jooq.log; then
              echo "jOOQ generation failed for a non-rate-limit reason." >&2
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "jOOQ generation failed after three explicit attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Build Java 21 HILTECH Spring Boot artifact
        run: ./gradlew :server:application:bootJar

      - name: Verify artifact and record exact-source digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/devops-server-package
          mapfile -t jars < <(find server/application/build/libs \
            -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | sort)
          if [[ "${#jars[@]}" != "1" ]]; then
            printf 'Expected exactly one executable Boot JAR, got %s\n' "${#jars[@]}" >&2
            exit 1
          fi
          test -s "${jars[0]}"
          sha256sum "${jars[0]}" > build/reports/devops-server-package/SHA256SUMS
          printf 'source_sha=%s\n' "${GITHUB_SHA}" \
            > build/reports/devops-server-package/source.txt
          printf 'artifact=%s\n' "${jars[0]}" \
            >> build/reports/devops-server-package/source.txt
          echo "Boot JAR packaged from ${GITHUB_SHA} with digest proof."

      - name: Prepare image context with verified JAR and Flyway sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find server/application/build/libs \
            -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | sort)
          test "${#jars[@]}" -eq 1
          context=build/tmp/hiltech-image-context
          mkdir -p "$context/migrations"
          cp "${jars[0]}" "$context/app.jar"
          cp -a database/migrations/. "$context/migrations/"
          test -s "$context/app.jar"
          test "$(find "$context/migrations" -maxdepth 1 -name 'V*.sql' -type f | wc -l)" -gt 0

      - name: Build and inspect nonroot pinned Java 21 container
        shell: bash
        run: |
          set -euo pipefail
          tag="hiltech-server:ci-${GITHUB_SHA}"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -f infrastructure/coolify/Dockerfile.server \
            -t "$tag" build/tmp/hiltech-image-context
          test "$(docker image inspect -f '{{.Config.User}}' "$tag")" = "10001:10001"
          docker run --rm --network none --entrypoint java "$tag" -version
          docker image inspect --format='{{.Id}}' "$tag" \
            > build/reports/devops-server-package/container-image-id.txt
          printf 'image_tag=%s\n' "$tag" \
            >> build/reports/devops-server-package/source.txt
          echo "CI-only image packaged; NOT pushed or deployed."

      - name: Run isolated Spring Boot container against disposable PostgreSQL
        shell: bash
        env:
          HILTECH_CI_IMAGE_SMOKE: "1"
        run: |
          set -euo pipefail
          bash scripts/devops/image-runtime-smoke.sh "hiltech-server:ci-${GITHUB_SHA}"

      # Oracle VM.Standard.A1.Flex is aarch64/ARM64. A successful amd64 CI
      # runtime smoke does NOT prove a deployable binary for that host.
      # This Dockerfile has no RUN instructions, so cross-building the ARM64
      # image does not require executing foreign-architecture code on CI.
      - name: Verify deployable ARM64 image for Oracle Ampere A1
        shell: bash
        run: |
          set -euo pipefail
          arm64_tag="hiltech-server:ci-arm64-${GITHUB_SHA}"
          docker build --platform linux/arm64 \\
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \\
            -f infrastructure/coolify/Dockerfile.server \\
            -t "$arm64_tag" build/tmp/hiltech-image-context
          test "$(docker image inspect -f '{{.Architecture}}' "$arm64_tag")" = "arm64"
          test "$(docker image inspect -f '{{.Os}}' "$arm64_tag")" = "linux"
          test "$(docker image inspect -f '{{.Config.User}}' "$arm64_tag")" = "10001:10001"
          docker image inspect --format='{{.Id}}' "$arm64_tag" \\
            > build/reports/devops-server-package/container-arm64-image-id.txt
          printf 'arm64_image_tag=%s\n' "$arm64_tag" \\
            >> build/reports/devops-server-package/source.txt
          echo "PASS: linux/arm64 OCI image built nonroot for Oracle A1."
          echo "NOTE: build proof only. ARM64 runtime, staging auth and recovery remain unverified."

      - name: Save restricted-lifetime build proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hiltech-server-bootjar-${{ github.sha }}
          path: |
            server/application/build/libs/*.jar
            build/reports/devops-server-package/*
          if-no-files-found: error
          retention-days: 7
