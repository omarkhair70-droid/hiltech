name: UX-128 Phase8 Finance native source evidence

on:
  push:
    branches:
      - "ux/128-finance8-source-read-native-20261123"
  pull_request:
    branches:
      - "integration/finance-8-release-candidate-20261123"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux128-finance-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-finance-reader:
    name: Finance read scope / Windows / Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Pinned Gradle setup
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Source-isolation regression and native builds
        run: |
          ./gradlew :shared:core:desktopTest \
            :apps:desktopApp:compileKotlin \
            :apps:androidApp:assembleDebug \
            --no-configuration-cache --no-daemon --console=plain
