name: Phase 3 — Offboarding Human Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "shared/**"
      - "server/application/src/main/kotlin/com/hiltech/server/people/**"
      - "server/application/src/main/kotlin/com/hiltech/server/identity/**"
      - "server/application/src/test/kotlin/com/hiltech/server/people/**"
      - "database/migrations/V0020__people_offboarding_skeleton.sql"
      - ".github/workflows/phase3-offboarding-human-proof.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-offboarding-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Render Windows offboarding flow
        env:
          HILTECH_PHASE3_OFFBOARDING_EVIDENCE_DIR: ${{ github.workspace }}/build/reports/phase3-offboarding
        run: |
          xvfb-run -a ./gradlew :apps:desktopApp:renderPhase3OffboardingEvidence \
            | tee /tmp/hiltech-phase3-offboarding.log
          grep -q "HILTECH_PHASE3_OFFBOARDING_RENDER_PASS" \
            /tmp/hiltech-phase3-offboarding.log
          test -s build/reports/phase3-offboarding/desktop-offboarding-access-pending.png
          test -s build/reports/phase3-offboarding/desktop-offboarding-access-clear.png
          test -s build/reports/phase3-offboarding/desktop-offboarding-completed.png

      - name: Upload offboarding evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hiltech-phase3-offboarding-evidence
          path: build/reports/phase3-offboarding/*.png
          if-no-files-found: error
          retention-days: 30
