name: Phase 6 — Controlled Document Revisions

on:
  pull_request:
    branches:
      - main
      - phase6/s04c-configurable-engineering-tests-20261122
    paths:
      - "database/migrations/V0037__controlled_document_revisions__phase6_slice04c.sql"
      - "server/application/src/main/kotlin/com/hiltech/server/work/WorkDocumentSource.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/work/ReadinessAssignmentService.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/work/FieldAssignedWorkContracts.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/work/FieldAssignedWorkPersistence.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/work/FieldAssignedWorkApi.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/work/ControlledWorkDocumentSourceTest.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/DatabaseMigrationContractTest.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/work/FieldAssignedWorkContracts.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/AssignedWorkSection.kt"
      - ".github/workflows/phase6-controlled-document-revisions.yml"
      - "docs/13-delivery/phase6/11_SLICE04C_CONTROLLED_DOCUMENT_REVISION_SOURCE_2026-11-22.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-document-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Verify controlled document source and Android projection
        run: >
          ./gradlew
          :server:application:test
          --tests com.hiltech.server.work.ControlledWorkDocumentSourceTest
          :shared:core:compileKotlinDesktop
          :apps:androidApp:compileDebugKotlin
          -Philtech.engineeringTestsEnabled=true
          -Philtech.assignedAssetLookupEnabled=true
          --no-configuration-cache --console=plain

  controlled-document-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Start disposable PostgreSQL
        run: >
          docker compose --env-file infrastructure/local/.env.example
          -f infrastructure/local/docker-compose.yml
          up -d postgres
      - name: Verify V0037 on real PostgreSQL
        env:
          HILTECH_DB_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://127.0.0.1:5432/hiltech
          HILTECH_DB_USER: hiltech_app
          HILTECH_DB_PASSWORD: hiltech-app-local
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
        run: >
          ./gradlew :server:application:test
          --tests com.hiltech.server.DatabaseMigrationContractTest
          --rerun-tasks --no-configuration-cache --console=plain
      - name: Test report on failure
        if: failure()
        run: >
          find server/application/build/test-results/test
          -type f -name '*.xml' -print -exec cat {} \; || true
      - name: Dispose PostgreSQL
        if: always()
        run: >
          docker compose --env-file infrastructure/local/.env.example
          -f infrastructure/local/docker-compose.yml
          down -v --remove-orphans
