name: Phase 2 — Shared Command Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/network/**"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/identity/**"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/network/**"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/identity/**"
      - "server/application/src/main/kotlin/com/hiltech/server/platform/**"
      - "server/application/src/main/kotlin/com/hiltech/server/identity/**"
      - "server/application/src/main/kotlin/com/hiltech/server/telemetry/**"
      - "server/application/src/test/kotlin/com/hiltech/server/platform/**"
      - "server/application/src/test/kotlin/com/hiltech/server/telemetry/**"
      - "server/application/build.gradle.kts"
      - "database/migrations/**"
      - ".github/workflows/phase2-shared-command-runtime.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  http-client-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up frozen Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Verify shared Android/Windows HTTP client contracts
        run: ./gradlew :shared:core:allTests --rerun-tasks

      - name: Verify server error and telemetry contracts
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.platform.http.ProductHttpRuntimeTest \
            --tests com.hiltech.server.telemetry.TelemetryFoundationContractTest \
            --rerun-tasks

      - name: Contract marker
        run: echo "HILTECH_PHASE2_COMMAND_HTTP_PASS client=PASS errors=PASS telemetry=PASS"

  postgres-idempotency-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up frozen Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Verify concurrent PostgreSQL idempotency contract
        env:
          HILTECH_COMMAND_RUNTIME_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
          HILTECH_DB_USER: hiltech
          HILTECH_DB_PASSWORD: hiltech
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.platform.command.IdempotentCommandPostgresContractTest \
            --rerun-tasks

      - name: Contract marker
        run: echo "HILTECH_PHASE2_COMMAND_IDEMPOTENCY_PASS postgres=PASS concurrent_duplicate=PASS replay=PASS"
