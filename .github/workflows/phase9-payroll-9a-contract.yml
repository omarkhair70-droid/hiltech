name: Phase 9 - Payroll 9A-9C policy, source, release, native

on:
  push:
    branches: ["integration/phase7-finance8i-native-ux-payroll9-20261123", "integration/phase7-finance8i-native-payroll9-sales10-20261123, integration/phase7-finance8i-native-payroll-sales10-service11-20261123"]
  pull_request:
    paths:
      - ".github/workflows/phase9-payroll-9a-contract.yml"
      - "server/application/src/main/kotlin/com/hiltech/server/payroll/**"
      - "server/application/src/test/kotlin/com/hiltech/server/payroll/**"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/payroll/**"
      - "database/migrations/V0067__payroll_period_snapshot__phase9_9a.sql"
      - "database/migrations/V0068__payroll_draft_run__phase9_9b.sql"
      - "database/migrations/V0069__payroll_run_release__phase9_9b.sql"
      - "database/migrations/V0070__payroll_correction_link__phase9_9c.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase9-payroll-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  payroll-9a-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HILTECH_PAYROLL_9A_CONTRACT_TEST: "1"
      HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
      HILTECH_DB_USER: hiltech
      HILTECH_DB_PASSWORD: hiltech
      HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Frozen Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: PostgreSQL migration, immutable snapshots, rights and negative safety
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.payroll.Payroll9aContractTest \
            --tests com.hiltech.server.payroll.Payroll9bDraftPostgresContractTest \
            --tests com.hiltech.server.payroll.Payroll9b9cDomainTest \
            --tests com.hiltech.server.payroll.Payroll9bSourceAssemblerTest \
            --tests com.hiltech.server.payroll.Payroll9cFinalPayTest \
            --tests com.hiltech.server.payroll.Payroll9bPeopleSeparationSourceTest \
            --tests com.hiltech.server.payroll.Payroll9cFinanceHandoffTest \
            --rerun-tasks
      - name: Compile exact server head
        run: ./gradlew :server:application:bootJar

  payroll-9a-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Frozen Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Compile Android and Windows shared payroll surface
        run: |
          ./gradlew :shared:core:allTests :apps:androidApp:assembleDebug \
            :apps:desktopApp:compileKotlin
