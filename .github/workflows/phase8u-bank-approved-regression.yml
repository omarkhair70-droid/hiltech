name: Phase 8U — Approved Bank PostgreSQL regression

on:
  push:
    branches:
      - fix/hiltech-p8u-bank-approved-fixture-20261123
  pull_request:
    branches:
      - phase8/finance-8u-ap-ar-cash-recording-20261123

permissions:
  contents: read

jobs:
  bank-approval-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HILTECH_DB_CONTRACT_TEST: "1"
      HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
      HILTECH_DB_USER: hiltech
      HILTECH_DB_PASSWORD: hiltech
      HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
      HILTECH_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Prove approved statement and immutable bank-intake guards
        run: >
          ./gradlew :server:application:test
          --tests 'com.hiltech.server.finance.FinanceBankStatementApprovedPostgresContractTest'
          --tests 'com.hiltech.server.finance.FinanceBankStatementIntakePostgresContractTest'
          --tests 'com.hiltech.server.finance.FinanceBankCsvParserTest'
          --rerun-tasks --no-daemon --no-configuration-cache --console=plain
