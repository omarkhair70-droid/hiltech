name: HILTECH Finance 8 unified RC contract
on:
  push:
    branches:
      - "integration/finance-8-release-candidate-20261123"
  pull_request:
    branches:
      - "integration/hiltech-release-candidate-20261123"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finance-unified-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finance-postgres:
    name: Unified Finance/PostgreSQL/Server contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Prove full current Flyway V0001-V0080 and staged Finance schema
        env:
          HILTECH_DB_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
          HILTECH_DB_USER: hiltech
          HILTECH_DB_PASSWORD: hiltech
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
          HILTECH_REPO_ROOT: ${{ github.workspace }}
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.DatabaseMigrationContractTest \
            --tests com.hiltech.server.finance.FinanceBankStatementApprovedPostgresContractTest \
            --tests com.hiltech.server.finance.FinanceCashAllocationPostgresContractTest \
            --tests com.hiltech.server.finance.FinanceCashVoidPostgresContractTest \
            --tests com.hiltech.server.finance.FinancePhysicalCashPostgresContractTest \
            --tests com.hiltech.server.finance.FinanceCashCountPostgresContractTest \
            --tests com.hiltech.server.finance.FinanceApArBalancePostgresContractTest \
            --tests com.hiltech.server.finance.FinanceArInvoiceIssuancePostgresContractTest \
            --tests com.hiltech.server.finance.FinanceArJournalPostgresContractTest \
            --tests com.hiltech.server.finance.FinanceCashCountVersionTest \
            --tests com.hiltech.server.finance.FinanceSignedBankReconciliationVersionTest \
            --tests com.hiltech.server.finance.FinanceBankReconciliationSignoffPostgresContractTest \
            --tests com.hiltech.server.finance.FinanceMixedBankCashPostgresContractTest \
            --no-daemon --console=plain --stacktrace
      - name: Explain synthetic finance test failures
        if: failure()
        run: |
          report="server/application/build/test-results/test/TEST-com.hiltech.server.finance.FinanceMixedBankCashPostgresContractTest.xml"
          if [ -f "$report" ]; then
            grep -A3 -m1 '<failure' "$report" | cut -c1-1800 || true
          fi
      - name: Package unified server
        run: ./gradlew :server:application:bootJar --no-daemon --console=plain
  native-compilation:
    name: Finance typed API and Windows/Android compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Shared finance transport tests
        run: |
          ./gradlew :shared:core:desktopTest \
            --tests 'com.hiltech.shared.core.finance.*' \
            --no-daemon --console=plain
      - name: Unified desktop and Android code compile
        run: |
          ./gradlew :apps:desktopApp:compileKotlin \
            :apps:androidApp:assembleDebug --no-daemon --console=plain
