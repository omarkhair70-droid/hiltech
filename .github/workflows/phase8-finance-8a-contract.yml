name: Phase 8 8A Finance source obligations

on:
  push:
    branches:
      - "phase8/finance-8a-source-obligations-20261122"
  pull_request:
    branches:
      - "phase7/s06-office-team-stock-20261122"

concurrency:
  group: phase8-finance-8a-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  finance-postgres-and-native:
    name: P8 Finance PostgreSQL and negative auth / Windows / Android
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify Finance migration, immutable sources and denied roles
        env:
          HILTECH_DB_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
          HILTECH_DB_USER: hiltech
          HILTECH_DB_PASSWORD: hiltech
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.finance.FinancePayableMigrationContractTest \
            --tests com.hiltech.server.finance.FinancePayableCandidateServiceTest \
            --no-daemon --console=plain
      - name: Compile native Finance module in Windows and Android targets
        run: |
          ./gradlew :apps:desktopApp:compileKotlin :apps:androidApp:assembleDebug \
            --no-daemon --console=plain
