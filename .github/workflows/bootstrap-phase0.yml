name: Bootstrap Phase 0

on:
  push:
    branches:
      - "bootstrap/**"
  pull_request:
    branches:
      - main
    paths:
      - "build-logic/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "shared/**"
      - "apps/**"
      - "server/**"
      - "database/**"
      - "infrastructure/**"
      - ".github/workflows/bootstrap-phase0.yml"

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up frozen Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Generate and commit Gradle Wrapper
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            WRAPPER_TMP="$(mktemp -d)"
            pushd "$WRAPPER_TMP"
            printf 'rootProject.name = "hiltech-wrapper-bootstrap"\n' > settings.gradle.kts
            gradle wrapper --gradle-version 9.5.0 --distribution-type bin
            popd

            cp "$WRAPPER_TMP/gradlew" ./gradlew
            cp "$WRAPPER_TMP/gradlew.bat" ./gradlew.bat
            mkdir -p gradle/wrapper
            cp "$WRAPPER_TMP/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            cp "$WRAPPER_TMP/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
            chmod +x gradlew

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "bootstrap: commit Gradle 9.5.0 wrapper"
            git push
          fi

      - name: Verify wrapper version
        run: ./gradlew --version

      - name: Shared tests
        run: ./gradlew :shared:core:allTests

      - name: Android debug build
        run: ./gradlew :apps:androidApp:assembleDebug

      - name: Desktop compile
        run: ./gradlew :apps:desktopApp:compileKotlin

      - name: Server tests
        run: ./gradlew :server:application:test


  database-contract:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Migrate empty PostgreSQL and verify first-slice constraints
        env:
          HILTECH_DB_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
          HILTECH_DB_USER: hiltech
          HILTECH_DB_PASSWORD: hiltech
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
        run: ./gradlew :server:application:test --tests com.hiltech.server.DatabaseMigrationContractTest

      - name: Generate and verify jOOQ Kotlin sources
        env:
          HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
          HILTECH_DB_USER: hiltech
          HILTECH_DB_PASSWORD: hiltech
        run: ./gradlew :server:application:verifyJooqGeneration

      - name: Compile server against generated jOOQ sources
        run: ./gradlew :server:application:compileKotlin
