name: Bootstrap Phase 0

on:
  push:
    branches:
      - "bootstrap/**"
  pull_request:
    branches:
      - main
    paths:
      - "build-logic/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "shared/**"
      - "apps/**"
      - "server/**"
      - "database/**"
      - "infrastructure/**"
      - ".github/workflows/bootstrap-phase0.yml"

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up frozen Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Generate and commit Gradle Wrapper
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.5.0 --distribution-type bin
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "bootstrap: commit Gradle 9.5.0 wrapper"
            git push
          fi

      - name: Verify wrapper version
        run: ./gradlew --version

      - name: Shared tests
        run: ./gradlew :shared:core:allTests

      - name: Android debug build
        run: ./gradlew :apps:androidApp:assembleDebug

      - name: Desktop compile
        run: ./gradlew :apps:desktopApp:compileKotlin

      - name: Server tests
        run: ./gradlew :server:application:test
