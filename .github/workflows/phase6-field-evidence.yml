name: Phase 6 — Durable Field Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "shared/core/src/**"
      - "shared/core/schemas/**"
      - "apps/androidApp/**"
      - "server/application/src/main/kotlin/com/hiltech/server/work/FieldAssignedWorkService.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/documents/**"
      - "server/application/src/test/kotlin/com/hiltech/server/documents/**"
      - "server/application/src/test/kotlin/com/hiltech/server/projects/**"
      - "docs/13-delivery/phase6/06_*"
      - ".github/workflows/phase6-field-evidence.yml"
      - "scripts/ci/phase6_android_field_evidence_smoke.sh"
  workflow_dispatch:

concurrency:
  group: \${{ github.workflow }}-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  field-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Prove Room v3 evidence durability and preserve earlier v1 migration
        run: |
          ./gradlew :shared:core:desktopTest \
            --tests com.hiltech.shared.core.field.FieldEvidenceQueueTest \
            --tests com.hiltech.shared.core.field.FieldEvidenceUploadCoordinatorTest \
            --tests com.hiltech.shared.core.local.FieldRoomMigrationTest \
            --tests com.hiltech.shared.core.local.HiltechLocalDatabaseTest \
            --no-configuration-cache --console=plain
      - name: Compile Android evidence capture and shell
        run: |
          ./gradlew :apps:androidApp:assembleDebug \
            -Philtech.apiBaseUrl=https://api.hiltech.invalid \
            -Philtech.oidcIssuerUri=https://identity.hiltech.invalid/realms/hiltech \
            --no-configuration-cache --console=plain
      - name: Verify state machine regression
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.work.FieldExecutionTransitionPolicyTest \
            --no-configuration-cache --console=plain
      - name: Upload v3 schema output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hiltech-phase6-s03-room-schema
          path: shared/core/schemas/com.hiltech.shared.core.local.HiltechLocalDatabase/3.json
          if-no-files-found: warn
          retention-days: 30


  evidence-postgres-quota-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Start isolated PostgreSQL, OpenFGA and S3-compatible storage
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml \
            up -d postgres openfga-migrate openfga moto
      - name: Wait for service readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/healthz >/dev/null && \
               curl -fsS http://127.0.0.1:5000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml logs --no-color --tail=100 postgres openfga moto
          exit 1
      - name: Load canonical OpenFGA model
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml \
            --profile tools run --rm openfga-cli \
            store create --model /contracts/first-slice-model.fga \
            > /tmp/hiltech-evidence-fga.json
          python3 - <<'PY'
          import json, os
          with open("/tmp/hiltech-evidence-fga.json", encoding="utf-8") as f:
              data = json.load(f)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f'HILTECH_FGA_STORE_ID={data["store"]["id"]}\n')
              f.write(f'HILTECH_FGA_MODEL_ID={data["model"]["authorization_model_id"]}\n')
          PY
      - name: Prove full Evidence lifecycle and concurrent maxCount enforcement
        env:
          HILTECH_EVIDENCE_LIFECYCLE_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://127.0.0.1:5432/hiltech
          HILTECH_DB_USER: hiltech_app
          HILTECH_DB_PASSWORD: hiltech-app-local
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
          HILTECH_FGA_ENABLED: "true"
          HILTECH_FGA_API_URL: http://127.0.0.1:8082
          S3_ENDPOINT: http://127.0.0.1:5000
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          ./gradlew :server:application:test \
            --tests 'com.hiltech.server.documents.EvidenceLifecyclePostgresOpenFgaS3ContractTest' \
            --rerun-tasks --no-configuration-cache --console=plain
      - name: Print test report on failure
        if: failure()
        run: |
          find server/application/build/test-results -name '*.xml' -type f \
            -print -exec cat {} \; || true
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml logs --no-color --tail=100 postgres openfga moto || true
      - name: Tear down test services
        if: always()
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml down -v --remove-orphans

  android-evidence-native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Build native Android Evidence APK
        run: |
          ./gradlew :apps:androidApp:assembleDebug \
            -Philtech.apiBaseUrl=https://api.hiltech.invalid \
            -Philtech.oidcIssuerUri=https://identity.hiltech.invalid/realms/hiltech \
            --no-configuration-cache --console=plain
      - name: Free disk for Android emulator
        run: |
          ./gradlew --stop || true
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/wrapper/dists" || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove local Evidence bytes survive app process death and tamper is rejected
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/ci/phase6_android_field_evidence_smoke.sh
      - name: Upload native Evidence proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hiltech-phase6-s03-native-evidence
          path: build/reports/phase6-slice03/*.png
          if-no-files-found: error
          retention-days: 30
