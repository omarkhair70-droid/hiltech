name: Spike — Room3 KMP Offline

on:
  push:
    branches:
      - "spike/room-offline-20260918"
    paths:
      - "spikes/kmp-android-windows/**"
      - ".github/workflows/spike-room-offline.yml"
  pull_request:
    paths:
      - "spikes/kmp-android-windows/shared/src/commonMain/kotlin/com/hiltech/spike/shared/local/**"
      - "spikes/kmp-android-windows/shared/src/androidMain/kotlin/com/hiltech/spike/shared/local/**"
      - "spikes/kmp-android-windows/shared/src/desktopMain/kotlin/com/hiltech/spike/shared/local/**"
      - "spikes/kmp-android-windows/shared/src/commonTest/**"
      - "spikes/kmp-android-windows/shared/build.gradle.kts"
      - "spikes/kmp-android-windows/androidApp/build.gradle.kts"
      - "spikes/kmp-android-windows/gradle/libs.versions.toml"
      - ".github/workflows/spike-room-offline.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-room:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/kmp-android-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Real SQLite desktop test
        run: gradle :shared:desktopTest --stacktrace

      - name: Android compile with generated Room code
        run: gradle :androidApp:assembleDebug --stacktrace

  windows-room:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spikes/kmp-android-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Real SQLite desktop test on Windows
        run: gradle :shared:desktopTest --stacktrace
