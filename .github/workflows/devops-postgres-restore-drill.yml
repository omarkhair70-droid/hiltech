name: DevOps — disposable PostgreSQL backup and restore rehearsal

on:
  push:
    branches: [devops/hiltech-postgres-restore-drill-20261123, devops/disposable-pg-restore-semantic-schema-20261123]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/devops-postgres-restore-drill.yml"
      - "scripts/devops/verify_disposable_pg_restore.sh"
      - "database/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    name: Postgres 18.6 dump, isolated restore, data and schema comparison
    runs-on: ubuntu-latest
    timeout-minutes: 23
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Migrate completely isolated PostgreSQL database with official Flyway contract
        env:
          HILTECH_DB_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://127.0.0.1:5432/hiltech
          HILTECH_DB_USER: hiltech
          HILTECH_DB_PASSWORD: hiltech
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.DatabaseMigrationContractTest \
            --rerun-tasks --no-daemon --no-configuration-cache --console=plain
      - name: Rehearse backup and restore to an additional empty database
        shell: bash
        run: bash scripts/devops/verify_disposable_pg_restore.sh
      - name: Publish only non-sensitive test proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pg18-disposable-recovery-checkpoint
          path: build/reports/devops-disposable-recovery/verification.txt
          if-no-files-found: warn
          retention-days: 14
