name: Phase 6 — Field Personal Issued Stock

on:
  pull_request:
    branches: [main]
    paths:
      - "server/application/src/main/kotlin/com/hiltech/server/work/FieldPersonalIssuedStock*"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/work/FieldPersonalIssuedStock*"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/work/FieldAssignedWorkApiClient.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/AssignedWorkSection.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/HiltechShell.kt"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/work/FieldPersonalIssuedStock*"
      - "apps/androidApp/src/main/kotlin/com/hiltech/android/MainActivity.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/work/FieldPersonalIssuedStock*"
      - ".github/workflows/phase6-field-issued-stock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-personal-issued-read-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Verify source authorization and own-Employee isolation
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.work.FieldPersonalIssuedStockServiceTest \
            --no-configuration-cache --console=plain
      - name: Verify shared read client transport and compile Android UI
        run: |
          ./gradlew :shared:core:desktopTest \
            --tests com.hiltech.shared.core.work.FieldPersonalIssuedStockApiClientTest \
            --no-configuration-cache --console=plain
          ./gradlew :apps:androidApp:assembleDebug \
            -Philtech.apiBaseUrl=https://api.hiltech.invalid \
            -Philtech.oidcIssuerUri=https://identity.hiltech.invalid/realms/hiltech \
            --no-configuration-cache --console=plain
