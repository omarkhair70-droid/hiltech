name: Spike — Binary Evidence Pipeline

on:
  push:
    branches:
      - "spike/binary-evidence-pipeline-20260918"
    paths:
      - "spikes/binary-evidence/**"
      - ".github/workflows/spike-binary-evidence.yml"
  pull_request:
    paths:
      - "spikes/binary-evidence/**"
      - ".github/workflows/spike-binary-evidence.yml"
  workflow_dispatch:

jobs:
  binary-evidence:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://127.0.0.1:5000

    defaults:
      run:
        working-directory: spikes/binary-evidence

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Moto S3 server 5.2.3
        run: python -m pip install --disable-pip-version-check "moto[server]==5.2.3"

      - name: Start disposable S3-compatible endpoint
        run: |
          nohup moto_server -H 127.0.0.1 -p 5000 >/tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/moto.log
          exit 1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Presigned upload checksum retry privacy tests
        run: gradle test --stacktrace

      - name: Moto logs on failure
        if: failure()
        run: cat /tmp/moto.log
