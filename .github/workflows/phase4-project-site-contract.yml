name: Phase 4 — Project Site Core

on:
  pull_request:
    branches:
      - main
    paths:
      - "database/migrations/V0021__projects_sites__slice01.sql"
      - "server/application/src/main/kotlin/com/hiltech/server/projects/**"
      - "server/application/src/test/kotlin/com/hiltech/server/projects/**"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/projects/**"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/ProjectControlSection.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/HiltechShell.kt"
      - "apps/desktopApp/**"
      - "docs/13-delivery/first-slice-contract-pack/openfga/**"
      - ".github/workflows/phase4-project-site-contract.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project-site-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Start disposable PostgreSQL and OpenFGA
        shell: bash
        run: |
          docker compose             --env-file infrastructure/local/.env.example             -f infrastructure/local/docker-compose.yml             up -d postgres openfga-migrate openfga

      - name: Wait for OpenFGA
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose             --env-file infrastructure/local/.env.example             -f infrastructure/local/docker-compose.yml             logs --no-color openfga
          exit 1

      - name: Load canonical authorization model
        shell: bash
        run: |
          docker compose             --env-file infrastructure/local/.env.example             -f infrastructure/local/docker-compose.yml             --profile tools run --rm openfga-cli             store create --model /contracts/first-slice-model.fga             | tee /tmp/hiltech-phase4-openfga.json

          grep -q 'authorization_model_id' /tmp/hiltech-phase4-openfga.json

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/hiltech-phase4-openfga.json", encoding="utf-8") as source:
              payload = json.load(source)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write(f'HILTECH_FGA_STORE_ID={payload["store"]["id"]}\n')
              target.write(
                  f'HILTECH_FGA_MODEL_ID={payload["model"]["authorization_model_id"]}\n'
              )
          PY

      - name: Verify Project Site production contract
        env:
          HILTECH_PROJECTS_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://127.0.0.1:5432/hiltech
          HILTECH_DB_USER: hiltech_app
          HILTECH_DB_PASSWORD: hiltech-app-local
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
          HILTECH_FGA_ENABLED: "true"
          HILTECH_FGA_API_URL: http://127.0.0.1:8082
        run: |
          ./gradlew :server:application:test             --tests com.hiltech.server.projects.ProjectsPostgresOpenFgaContractTest             --rerun-tasks             --console=plain

      - name: Contract test report on failure
        if: failure()
        shell: bash
        run: |
          find server/application/build/test-results/test             -type f -name '*.xml' -print -exec cat {} \;             || true

      - name: Local platform logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose             --env-file infrastructure/local/.env.example             -f infrastructure/local/docker-compose.yml             logs --no-color --tail=300             postgres openfga

      - name: Stop disposable platform
        if: always()
        shell: bash
        run: |
          docker compose             --env-file infrastructure/local/.env.example             -f infrastructure/local/docker-compose.yml             down -v --remove-orphans

  desktop-project-site-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Render Windows Project Site flows
        env:
          HILTECH_PHASE4_PROJECT_SITE_EVIDENCE_DIR: ${{ github.workspace }}/build/reports/phase4-project-site
        run: |
          xvfb-run -a ./gradlew :apps:desktopApp:renderPhase4ProjectSiteEvidence             | tee /tmp/hiltech-phase4-project-site.log
          grep -q "HILTECH_PHASE4_PROJECT_SITE_RENDER_PASS"             /tmp/hiltech-phase4-project-site.log
          test -s build/reports/phase4-project-site/desktop-my-projects-draft.png
          test -s build/reports/phase4-project-site/desktop-project-site-planning.png
          test -s build/reports/phase4-project-site/desktop-project-version-conflict.png

      - name: Upload Project Site evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hiltech-phase4-project-site-evidence
          path: build/reports/phase4-project-site/*.png
          if-no-files-found: error
          retention-days: 30
