name: Spike — KMP Android + Windows

on:
  push:
    branches:
      - "spike/kmp-android-windows-20260918"
    paths:
      - "spikes/kmp-android-windows/**"
      - ".github/workflows/spike-kmp-android-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "spikes/kmp-android-windows/**"
      - ".github/workflows/spike-kmp-android-windows.yml"
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/kmp-android-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Shared tests
        run: gradle :shared:allTests --stacktrace

      - name: Android debug build
        run: gradle :androidApp:assembleDebug --stacktrace

      - name: Desktop compile
        run: gradle :desktopApp:compileKotlin --stacktrace

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spikes/kmp-android-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Desktop compile
        run: gradle :desktopApp:compileKotlin --stacktrace

      - name: Windows EXE package
        run: gradle :desktopApp:packageExe --stacktrace

      - name: Windows MSI package
        run: gradle :desktopApp:packageMsi --stacktrace
