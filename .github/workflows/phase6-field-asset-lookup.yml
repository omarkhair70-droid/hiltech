name: Phase 6 — Assigned Work AssetTag Lookup

on:
  pull_request:
    branches:
      - main
      - phase6/s04b-material-reconciliation-20261121
    paths:
      - "server/application/src/main/kotlin/com/hiltech/server/work/FieldAssignedAssetLookup.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/work/FieldAssignedAssetLookupServiceTest.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/work/FieldAssignedWorkApiClient.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/AssignedWorkSection.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/HiltechShell.kt"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/work/FieldAssignedAssetLookupApiClientTest.kt"
      - "apps/androidApp/src/main/kotlin/com/hiltech/android/MainActivity.kt"
      - "apps/androidApp/build.gradle.kts"
      - "server/application/src/main/resources/application.yml"
      - ".github/workflows/phase6-field-asset-lookup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-asset-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Verify assigned Asset lookup contract
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.work.FieldAssignedAssetLookupServiceTest \
            --no-configuration-cache --console=plain

  field-asset-client-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Verify client route and Android compile with field lookup enabled
        run: |
          ./gradlew \
            :shared:core:desktopTest \
            --tests com.hiltech.shared.core.work.FieldAssignedAssetLookupApiClientTest \
            :apps:androidApp:compileDebugKotlin \
            -Philtech.assignedAssetLookupEnabled=true \
            --no-configuration-cache --console=plain
