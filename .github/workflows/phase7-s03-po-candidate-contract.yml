      - "server/application/src/main/kotlin/com/hiltech/server/procurement/PurchaseOrderIssue*"
      - "server/application/src/main/kotlin/com/hiltech/server/procurement/PurchaseOrderLifecycle*"
      - "server/application/src/main/kotlin/com/hiltech/server/procurement/PurchaseOrderDeliveryAmendment*"
      - "server/application/src/test/kotlin/com/hiltech/server/procurement/PurchaseOrderCandidate*"
      - "server/application/src/test/kotlin/com/hiltech/server/procurement/PurchaseOrderIssue*"
      - "server/application/src/test/kotlin/com/hiltech/server/procurement/PurchaseOrderLifecycle*"
      - "server/application/src/test/kotlin/com/hiltech/server/procurement/PurchaseOrderDeliveryAmendment*"
      - "server/application/src/test/kotlin/com/hiltech/server/DatabaseMigrationContractTest.kt"
      - "apps/desktopApp/src/main/kotlin/com/hiltech/desktop/Main.kt"
      - "apps/desktopApp/src/main/kotlin/com/hiltech/desktop/DesktopIdentityRuntime.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/procurement/SupplierSourcingBuyerSection.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderCandidate*"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderIssue*"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderCancellation*"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderDeliveryAmendment*"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderCandidate*"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderIssue*"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderDeliveryAmendment*"
      - "docs/13-delivery/phase7/06_S03_PO_CANDIDATE_APPROVAL_CHECKPOINT.md"

concurrency:
  group: phase7-s03-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  po-candidate-postgres:
    name: Verified S03 candidate contract with PostgreSQL and native clients
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Test V0046 migration and candidate buyer protection
        env:
          HILTECH_DB_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
          HILTECH_DB_USER: hiltech
          HILTECH_DB_PASSWORD: hiltech
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.DatabaseMigrationContractTest \
            --tests com.hiltech.server.procurement.PurchaseOrderCandidateServiceTest \
            --tests com.hiltech.server.procurement.PurchaseOrderCandidateApprovalSubjectTest \
            --tests com.hiltech.server.procurement.PurchaseOrderCandidateApprovalRequestTest \
            --tests com.hiltech.server.procurement.PurchaseOrderIssueServiceTest \
            --tests com.hiltech.server.procurement.PurchaseOrderLifecycleServiceTest \
            --tests com.hiltech.server.procurement.PurchaseOrderDeliveryAmendmentServiceTest \
            --tests com.hiltech.server.procurement.PurchaseOrderDeliveryAmendmentSubjectTest \
            --tests com.hiltech.server.procurement.SupplierSourcingServiceTest \
            --no-daemon --console=plain
      - name: Verify KMP buyer candidate transport
        run: |
          ./gradlew :shared:core:desktopTest \
            --tests '*PurchaseOrderCandidateApiClientTest' \
            --tests '*PurchaseOrderIssueApiClientTest' \
            --tests '*PurchaseOrderDeliveryAmendmentApiClientTest' \
            --no-daemon --console=plain
      - name: Compile Android and Windows candidate surfaces
        run: |
          ./gradlew :apps:desktopApp:compileKotlin :apps:androidApp:assembleDebug \
            --no-daemon --console=plain
