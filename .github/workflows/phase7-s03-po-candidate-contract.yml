      - "server/application/src/test/kotlin/com/hiltech/server/procurement/PurchaseOrderDeliveryAmendment*"
      - "server/application/src/test/kotlin/com/hiltech/server/DatabaseMigrationContractTest.kt"
      - "apps/desktopApp/src/main/kotlin/com/hiltech/desktop/Main.kt"
      - "apps/desktopApp/src/main/kotlin/com/hiltech/desktop/DesktopIdentityRuntime.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/procurement/SupplierSourcingBuyerSection.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderCandidate*"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderIssue*"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderCancellation*"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderDeliveryAmendment*"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderCandidate*"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderIssue*"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/procurement/PurchaseOrderDeliveryAmendment*"
      - "docs/13-delivery/phase7/06_S03_PO_CANDIDATE_APPROVAL_CHECKPOINT.md"
  pull_request:
    branches:
      - "phase7/s02-technical-review-events-20261122"
    paths:
      - ".github/workflows/phase7-s03-po-candidate-contract.yml"
      - "database/migrations/V0046__procurement_po_candidate_snapshot__phase7_slice03.sql"
      - "database/migrations/V0047__procurement_po_issue__phase7_slice03.sql"
      - "database/migrations/V0048__procurement_po_lifecycle__phase7_slice03.sql"
