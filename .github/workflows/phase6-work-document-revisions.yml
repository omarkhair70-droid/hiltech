name: Phase 6 — Work Document Revisions

on:
  pull_request:
    branches:
      - phase6/s04c-engineering-test-offline-20261122
    paths:
      - "database/migrations/V0037__work_document_revisions__phase6_slice04d.sql"
      - "server/application/src/main/kotlin/com/hiltech/server/work/WorkDocumentRevisionPersistence.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/work/WorkDocumentRevisionService.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/work/FieldAssignedWorkPersistence.kt"
      - "server/application/src/main/kotlin/com/hiltech/server/work/ReadinessAssignmentService.kt"
      - "server/application/src/main/resources/application.yml"
      - "server/application/src/test/kotlin/com/hiltech/server/work/WorkDocumentRevisionPostgresContractTest.kt"
      - "server/application/src/test/kotlin/com/hiltech/server/work/WorkDocumentRevisionSourceTest.kt"
      - ".github/workflows/phase6-work-document-revisions.yml"
      - "docs/13-delivery/phase6/12_SLICE04D_WORK_DOCUMENT_REVISIONS_2026-11-22.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  work-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hiltech
          POSTGRES_USER: hiltech
          POSTGRES_PASSWORD: hiltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiltech -d hiltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      HILTECH_DB_CONTRACT_TEST: "1"
      HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech
      HILTECH_DB_USER: hiltech
      HILTECH_DB_PASSWORD: hiltech
      HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Verify architecture, source, and field contracts
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.ArchitectureTest \
            --tests com.hiltech.server.work.WorkDocumentRevisionSourceTest \
            --tests com.hiltech.server.work.FieldAssignedAssetLookupServiceTest \
            --tests com.hiltech.server.work.FieldEngineeringTestServiceTest \
            --tests com.hiltech.server.warehouse.WarehouseFieldAssignedAssetSourceTest \
            --no-configuration-cache --console=plain

      - name: Create isolated contract databases
        env:
          PGPASSWORD: hiltech
        run: |
          psql -h localhost -U hiltech -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE hiltech_migration;
          CREATE DATABASE hiltech_work_documents;
          SQL

      - name: Verify empty-database migration contract through V0037
        env:
          HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech_migration
        run: |
          if ! ./gradlew :server:application:test \
            --tests com.hiltech.server.DatabaseMigrationContractTest \
            --rerun-tasks --no-configuration-cache --console=plain --info; then
            cat server/application/build/test-results/test/TEST-com.hiltech.server.DatabaseMigrationContractTest.xml || true
            exit 1
          fi

      - name: Verify Work document revision semantics on PostgreSQL
        env:
          HILTECH_DB_URL: jdbc:postgresql://localhost:5432/hiltech_work_documents
        run: |
          ./gradlew             :server:application:test               --tests com.hiltech.server.work.WorkDocumentRevisionPostgresContractTest             --rerun-tasks --no-configuration-cache --console=plain

      - name: Verify rollout default remains OFF
        run: |
          grep -Fq 'enabled: ${HILTECH_FIELD_WORK_DOCUMENTS_ENABLED:false}'             server/application/src/main/resources/application.yml

      - name: Verify clean patch formatting
        run: git diff --check HEAD^ HEAD
