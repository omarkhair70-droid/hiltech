name: Phase 4 — Assigned Work Mobile Handoff

on:
  pull_request:
    branches:
      - main
    paths:
      - "server/application/src/main/kotlin/com/hiltech/server/work/FieldAssignedWork**"
      - "server/application/src/test/kotlin/com/hiltech/server/projects/ProjectsPostgresOpenFgaContractTest.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/work/FieldAssignedWork**"
      - "shared/core/src/commonTest/kotlin/com/hiltech/shared/core/work/FieldAssignedWorkApiClientTest.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/AssignedWorkSection.kt"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/HiltechShell.kt"
      - "apps/androidApp/**"
      - "scripts/ci/phase4_android_assigned_work_smoke.sh"
      - ".github/workflows/phase4-assigned-work-mobile-handoff.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assigned-work-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Start disposable PostgreSQL and OpenFGA
        shell: bash
        run: |
          docker compose \
            --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml \
            up -d postgres openfga-migrate openfga

      - name: Wait for OpenFGA
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml logs --no-color openfga
          exit 1

      - name: Load canonical authorization model
        shell: bash
        run: |
          docker compose \
            --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml \
            --profile tools run --rm openfga-cli \
            store create --model /contracts/first-slice-model.fga \
            | tee /tmp/hiltech-phase4-slice06-openfga.json

          grep -q 'authorization_model_id' /tmp/hiltech-phase4-slice06-openfga.json

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/hiltech-phase4-slice06-openfga.json", encoding="utf-8") as source:
              payload = json.load(source)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write(f'HILTECH_FGA_STORE_ID={payload["store"]["id"]}\n')
              target.write(f'HILTECH_FGA_MODEL_ID={payload["model"]["authorization_model_id"]}\n')
          PY

      - name: Verify current assigned-work Today and JobBundle vertical
        env:
          HILTECH_PROJECTS_CONTRACT_TEST: "1"
          HILTECH_DB_URL: jdbc:postgresql://127.0.0.1:5432/hiltech
          HILTECH_DB_USER: hiltech_app
          HILTECH_DB_PASSWORD: hiltech-app-local
          HILTECH_MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
          HILTECH_FGA_ENABLED: "true"
          HILTECH_FGA_API_URL: http://127.0.0.1:8082
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.projects.ProjectsPostgresOpenFgaContractTest \
            --rerun-tasks \
            --console=plain

      - name: Verify shared Slice06 client
        run: |
          ./gradlew :shared:core:desktopTest \
            --tests com.hiltech.shared.core.work.FieldAssignedWorkApiClientTest \
            --console=plain

      - name: Contract reports on failure
        if: failure()
        shell: bash
        run: |
          find server/application/build/test-results shared/core/build/test-results \
            -type f -name '*.xml' -print -exec cat {} \; || true

      - name: Local platform logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml logs --no-color --tail=300 postgres openfga

      - name: Stop disposable platform
        if: always()
        shell: bash
        run: |
          docker compose --env-file infrastructure/local/.env.example \
            -f infrastructure/local/docker-compose.yml down -v --remove-orphans

  android-assigned-work-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Build Android debug evidence APK
        run: |
          ./gradlew :apps:androidApp:assembleDebug \
            -Philtech.apiBaseUrl=https://api.hiltech.invalid \
            -Philtech.oidcIssuerUri=https://identity.hiltech.invalid/realms/hiltech

      - name: Free runner disk before emulator
        shell: bash
        run: |
          ./gradlew --stop || true
          rm -rf "$HOME/.gradle/caches" || true
          rm -rf "$HOME/.gradle/wrapper/dists" || true
          df -h /

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render Arabic RTL assigned-work flow
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/ci/phase4_android_assigned_work_smoke.sh

      - name: Verify Slice06 Android evidence
        run: |
          test -s build/reports/phase4-slice06/android-today-rtl.png
          test -s build/reports/phase4-slice06/android-job-bundle-blocked.png
          test -s build/reports/phase4-slice06/android-assignment-revoked.png

      - name: Upload Slice06 Android evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hiltech-phase4-slice06-android-evidence
          path: build/reports/phase4-slice06/*.png
          if-no-files-found: error
          retention-days: 30
