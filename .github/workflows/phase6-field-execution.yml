name: Phase 6 — Assigned Field Execution

on:
  pull_request:
    branches: [main]
    paths:
      - "server/application/src/main/kotlin/com/hiltech/server/work/FieldExecution*"
      - "server/application/src/test/kotlin/com/hiltech/server/work/FieldExecution*"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/field/**"
      - "shared/core/src/desktopTest/kotlin/com/hiltech/shared/core/field/**"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/sync/**"
      - "apps/androidApp/**"
      - "docs/13-delivery/phase6/05_*"
      - ".github/workflows/phase6-field-execution.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  field-execution-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.5.0"

      - name: Verify field execution transition state machine and server build
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.work.FieldExecutionTransitionPolicyTest \
            --console=plain

      - name: Verify persisted Room field intent and scoped command replay
        run: |
          ./gradlew :shared:core:desktopTest \
            --tests com.hiltech.shared.core.field.FieldExecutionQueueTest \
            --tests com.hiltech.shared.core.sync.PendingCommandReplayEngineTest \
            --tests com.hiltech.shared.core.sync.KtorPendingCommandTransportTest \
            --console=plain

      - name: Compile native Android field code
        run: |
          ./gradlew :apps:androidApp:assembleDebug \
            -Philtech.apiBaseUrl=https://api.hiltech.invalid \
            -Philtech.oidcIssuerUri=https://identity.hiltech.invalid/realms/hiltech \
            --console=plain

      - name: Evidence on failure
        if: failure()
        shell: bash
        run: |
          find server/application/build/test-results shared/core/build/test-results \
            -type f -name '*.xml' -print -exec cat {} \; || true

  field-execution-native-room-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.5.0"

      - name: Build native Android evidence APK
        run: |
          ./gradlew :apps:androidApp:assembleDebug \
            -Philtech.apiBaseUrl=https://api.hiltech.invalid \
            -Philtech.oidcIssuerUri=https://identity.hiltech.invalid/realms/hiltech \
            --console=plain

      - name: Free disk for Android emulator
        shell: bash
        run: |
          ./gradlew --stop || true
          rm -rf "$HOME/.gradle/caches" || true
          rm -rf "$HOME/.gradle/wrapper/dists" || true
          df -h /

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify real native Room field-command process restart
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/ci/phase6_android_field_execution_smoke.sh

      - name: Verify synthetic native evidence artifacts
        run: |
          test -s build/reports/phase6-slice02/android-field-command-local-pending.png
          test -s build/reports/phase6-slice02/android-field-command-process-restart.png

      - name: Upload field execution native proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hiltech-phase6-slice02-native-field-evidence
          path: build/reports/phase6-slice02/*.png
          if-no-files-found: error
          retention-days: 30
