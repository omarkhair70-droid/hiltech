name: Phase 6 — Assigned Field Execution

on:
  pull_request:
    branches: [main]
    paths:
      - "server/application/src/main/kotlin/com/hiltech/server/work/FieldExecution*"
      - "server/application/src/test/kotlin/com/hiltech/server/work/FieldExecution*"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/field/**"
      - "shared/core/src/desktopTest/kotlin/com/hiltech/shared/core/field/**"
      - "shared/core/src/commonMain/kotlin/com/hiltech/shared/core/sync/**"
      - "apps/androidApp/**"
      - "docs/13-delivery/phase6/05_*"
      - ".github/workflows/phase6-field-execution.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  field-execution-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Verify field execution transition state machine and server build
        run: |
          ./gradlew :server:application:test \
            --tests com.hiltech.server.work.FieldExecutionTransitionPolicyTest \
            --console=plain

      - name: Compile native Android field code
        run: |
          ./gradlew :apps:androidApp:assembleDebug \
            -Philtech.apiBaseUrl=https://api.hiltech.invalid \
            -Philtech.oidcIssuerUri=https://identity.hiltech.invalid/realms/hiltech \
            --console=plain

      - name: Evidence on failure
        if: failure()
        shell: bash
        run: |
          find server/application/build/test-results shared/core/build/test-results \
            -type f -name '*.xml' -print -exec cat {} \; || true
