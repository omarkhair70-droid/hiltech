name: hiltech-local

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: hiltech_local_admin
      POSTGRES_PASSWORD: ${HILTECH_LOCAL_POSTGRES_ADMIN_PASSWORD:-hiltech-local-admin}
      HILTECH_APP_DB_PASSWORD: ${HILTECH_LOCAL_APP_DB_PASSWORD:-hiltech-app-local}
      HILTECH_KEYCLOAK_DB_PASSWORD: ${HILTECH_LOCAL_KEYCLOAK_DB_PASSWORD:-hiltech-keycloak-local}
      HILTECH_OPENFGA_DB_PASSWORD: ${HILTECH_LOCAL_OPENFGA_DB_PASSWORD:-hiltech-openfga-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/001-init-databases.sh:/docker-entrypoint-initdb.d/001-init-databases.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U hiltech_local_admin -d postgres
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/hiltech_keycloak
      KC_DB_USERNAME: hiltech_keycloak
      KC_DB_PASSWORD: ${HILTECH_LOCAL_KEYCLOAK_DB_PASSWORD:-hiltech-keycloak-local}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${HILTECH_LOCAL_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${HILTECH_LOCAL_KEYCLOAK_ADMIN_PASSWORD:-hiltech-admin-local}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9001:9000"
    volumes:
      - ./keycloak/hiltech-realm.json:/opt/keycloak/data/import/hiltech-realm.json:ro

  openfga-migrate:
    image: openfga/openfga:v1.20.0
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://hiltech_openfga:${HILTECH_LOCAL_OPENFGA_DB_PASSWORD:-hiltech-openfga-local}@postgres:5432/hiltech_openfga?sslmode=disable
    restart: "no"

  openfga:
    image: openfga/openfga:v1.20.0
    restart: unless-stopped
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    command:
      - run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://hiltech_openfga:${HILTECH_LOCAL_OPENFGA_DB_PASSWORD:-hiltech-openfga-local}@postgres:5432/hiltech_openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:3000:3000"

  openfga-cli:
    image: openfga/cli:v0.7.20
    profiles:
      - tools
    depends_on:
      - openfga
    environment:
      FGA_API_URL: http://openfga:8080
    volumes:
      - ../../docs/13-delivery/first-slice-contract-pack/openfga:/contracts:ro

  moto:
    image: motoserver/moto:5.2.3
    restart: unless-stopped
    environment:
      MOTO_PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  postgres-data:
