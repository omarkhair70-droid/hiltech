# HILTECH synthetic-data STAGING ONLY; deploy dependencies before the 'api' profile.
# Never reuse the local development compose or existing app volumes.
name: ${HILTECH_COMPOSE_PROJECT_NAME:?Set isolated HILTECH staging project name}

x-default-security: &default-security
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6
    <<: *default-security
    mem_limit: 768m
    cpus: 1.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${HILTECH_PG_ADMIN_PASSWORD:?Set private PostgreSQL admin secret}
      HILTECH_APP_DB_PASSWORD: ${HILTECH_APP_DB_PASSWORD:?Set separate app DB secret}
      HILTECH_KEYCLOAK_DB_PASSWORD: ${HILTECH_KEYCLOAK_DB_PASSWORD:?Set separate Keycloak DB secret}
      HILTECH_OPENFGA_DB_PASSWORD: ${HILTECH_OPENFGA_DB_PASSWORD:?Set separate OpenFGA DB secret}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/20-hiltech-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [private]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    <<: *default-security
    mem_limit: 1536m
    cpus: 1.25
    command: ["start"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/hiltech_keycloak
      KC_DB_USERNAME: hiltech_keycloak
      KC_DB_PASSWORD: ${HILTECH_KEYCLOAK_DB_PASSWORD:?Set Keycloak DB secret}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${HILTECH_KC_BOOTSTRAP_ADMIN_USERNAME:?Set temporary first-admin name}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${HILTECH_KC_BOOTSTRAP_ADMIN_PASSWORD:?Set temporary first-admin secret}
      KC_HTTP_ENABLED: "true" # internal HTTP behind HTTPS Coolify proxy
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${HILTECH_KC_PUBLIC_URL:?Set verified HTTPS Keycloak URL}
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
    expose: ["8080"]
    networks: [private, proxy]

  openfga-migrate:
    image: openfga/openfga:v1.20.0
    restart: "no"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: ${HILTECH_OPENFGA_DATABASE_URI:?Set private OpenFGA DB URI}
    networks: [private]

  openfga:
    image: openfga/openfga:v1.20.0
    <<: *default-security
    mem_limit: 512m
    cpus: 0.75
    command: ["run"]
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: ${HILTECH_OPENFGA_DATABASE_URI:?Set private OpenFGA DB URI}
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "false"
    expose: ["8080"]
    networks: [private]

volumes:
  pg_data:

networks:
  private:
    internal: true
  proxy:
    external: true
    name: ${HILTECH_COOLIFY_PROXY_NETWORK:?Set existing Coolify proxy network name}
