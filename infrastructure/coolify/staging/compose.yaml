# HILTECH synthetic-data STAGING ONLY; deploy dependencies before the 'api' profile.
# Never reuse the local development compose or existing app volumes.
name: ${HILTECH_COMPOSE_PROJECT_NAME:?Set isolated HILTECH staging project name}

x-default-security: &default-security
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6
    <<: *default-security
    mem_limit: 768m
    cpus: 1.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${HILTECH_PG_ADMIN_PASSWORD:?Set private PostgreSQL admin secret}
      HILTECH_APP_DB_PASSWORD: ${HILTECH_APP_DB_PASSWORD:?Set separate app DB secret}
      HILTECH_KEYCLOAK_DB_PASSWORD: ${HILTECH_KEYCLOAK_DB_PASSWORD:?Set separate Keycloak DB secret}
      HILTECH_OPENFGA_DB_PASSWORD: ${HILTECH_OPENFGA_DB_PASSWORD:?Set separate OpenFGA DB secret}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/20-hiltech-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [private]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    <<: *default-security
    mem_limit: 1536m
    cpus: 1.25
    command: ["start"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/hiltech_keycloak
      KC_DB_USERNAME: hiltech_keycloak
      KC_DB_PASSWORD: ${HILTECH_KEYCLOAK_DB_PASSWORD:?Set Keycloak DB secret}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${HILTECH_KC_BOOTSTRAP_ADMIN_USERNAME:?Set temporary first-admin name}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${HILTECH_KC_BOOTSTRAP_ADMIN_PASSWORD:?Set temporary first-admin secret}
      KC_HTTP_ENABLED: "true" # internal HTTP behind HTTPS Coolify proxy
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${HILTECH_KC_PUBLIC_URL:?Set verified HTTPS Keycloak URL}
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
    expose: ["8080"]
    networks: [private, proxy]

  openfga-migrate:
    image: openfga/openfga:v1.20.0
    restart: "no"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: ${HILTECH_OPENFGA_DATABASE_URI:?Set private OpenFGA DB URI}
    networks: [private]

  openfga:
    image: openfga/openfga:v1.20.0
    <<: *default-security
    mem_limit: 512m
    cpus: 0.75
    command: ["run"]
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: ${HILTECH_OPENFGA_DATABASE_URI:?Set private OpenFGA DB URI}
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "false"
    expose: ["8080"]
    networks: [private]

  hiltech-api:
    # Verified immutable ARM64/AMD64 release, source fae1d7f36eb9adeaecfea6ccbd07baba6b2af646
    image: ghcr.io/omarkhair70-droid/hiltech-server@sha256:6bf83b62746cf6811a610e0f59e9f35469a9fe4b7061bc01debe48c1d8e4d1e8
    <<: *default-security
    profiles: ["api"]
    init: true
    mem_limit: 1536m
    cpus: 1.5
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      openfga:
        condition: service_started
    environment:
      HILTECH_SERVER_PORT: "8080"
      HILTECH_DB_URL: jdbc:postgresql://postgres:5432/hiltech
      HILTECH_DB_USER: hiltech_app
      HILTECH_DB_PASSWORD: ${HILTECH_APP_DB_PASSWORD:?Set app DB secret}
      HILTECH_OIDC_ENABLED: "true"
      HILTECH_OIDC_ISSUER_URI: ${HILTECH_OIDC_ISSUER_URI:?Set Keycloak realm issuer URI}
      HILTECH_OIDC_AUDIENCE: ${HILTECH_OIDC_AUDIENCE:?Set token audience}
      HILTECH_OIDC_NATIVE_CLIENT_ID: ${HILTECH_OIDC_NATIVE_CLIENT_ID:?Set registered native client}
      HILTECH_FGA_ENABLED: "true"
      HILTECH_FGA_API_URL: http://openfga:8080
      HILTECH_FGA_STORE_ID: ${HILTECH_FGA_STORE_ID:?Provision real FGA store}
      HILTECH_FGA_MODEL_ID: ${HILTECH_FGA_MODEL_ID:?Publish reviewed FGA model}
      HILTECH_EVIDENCE_STORAGE_ENABLED: "true"
      # Must resolve over HTTPS from Android and Windows for presigned upload URLs.
      HILTECH_EVIDENCE_STORAGE_ENDPOINT: ${HILTECH_EVIDENCE_STORAGE_ENDPOINT:?Set HTTPS S3 endpoint}
      HILTECH_EVIDENCE_STORAGE_REGION: ${HILTECH_EVIDENCE_STORAGE_REGION:?Set S3 region}
      HILTECH_EVIDENCE_STORAGE_BUCKET: ${HILTECH_EVIDENCE_STORAGE_BUCKET:?Set isolated staging bucket}
      HILTECH_EVIDENCE_STORAGE_ACCESS_KEY: ${HILTECH_EVIDENCE_STORAGE_ACCESS_KEY:?Set scoped S3 access key}
      HILTECH_EVIDENCE_STORAGE_SECRET_KEY: ${HILTECH_EVIDENCE_STORAGE_SECRET_KEY:?Set scoped S3 secret key}
      HILTECH_ACTIVITY_CURSOR_SIGNING_KEY: ${HILTECH_ACTIVITY_CURSOR_SIGNING_KEY:?Set signing key}
      HILTECH_APPROVAL_CURSOR_SIGNING_KEY: ${HILTECH_APPROVAL_CURSOR_SIGNING_KEY:?Set signing key}
      HILTECH_INBOX_CURSOR_SIGNING_KEY: ${HILTECH_INBOX_CURSOR_SIGNING_KEY:?Set signing key}
      HILTECH_FIELD_PERSONAL_ISSUED_STOCK_ENABLED: "false"
      HILTECH_FIELD_MATERIAL_USAGE_REPORT_ENABLED: "false"
      HILTECH_FIELD_MATERIAL_USAGE_REVIEW_READ_ENABLED: "false"
      HILTECH_FIELD_MATERIAL_USAGE_RECONCILIATION_ENABLED: "false"
      HILTECH_FIELD_ASSIGNED_ASSET_LOOKUP_ENABLED: "false"
      HILTECH_FIELD_ENGINEERING_TESTS_ENABLED: "false"
      HILTECH_FIELD_WORK_DOCUMENTS_ENABLED: "false"
      HILTECH_FIELD_COMPLETION_ENABLED: "false"
    expose: ["8080"]
    networks: [private, proxy]

volumes:
  pg_data:

networks:
  private:
    internal: true
  proxy:
    external: true
    name: ${HILTECH_COOLIFY_PROXY_NETWORK:?Set existing Coolify proxy network name}
